/* ─────────── פונקציות טהורות ─────────── */

function qNum(v, dflt){ var n = parseFloat(v); return isFinite(n) ? n : (dflt||0); }

/* מספרי האורחים בשלושת התרחישים.
   over = דריסות ידניות; ערך ריק או 0 משמעו "חשב לי". */
function scenarioGuests(invited, attendPct, over){
  over = over || {};
  var inv  = Math.round(qNum(invited,0));
  var base = Math.round(inv * qNum(attendPct,0) / 100);
  var pick = function(k, dflt){ var v = qNum(over[k],0); return v > 0 ? Math.round(v) : dflt; };
  return {
    invited: inv,
    pct:     qNum(attendPct,0),
    base:    base,
    pess:    pick('pess', Math.round(base * 0.85)),
    exp:     pick('exp',  base),
    opt:     pick('opt',  Math.min(inv, Math.round(base * 1.12)))
  };
}

/* מצב הכיסוי של פריט בהצעה — נגזר מהשורות, לא נשמר בנפרד. */
function itemState(lines, item){
  var mine = (lines||[]).filter(function(l){ return l.cat === item; });
  if (!mine.length) return 'none';                                    // לא טופל
  if (mine.some(function(l){ return l.ext; })) return 'missing';      // לא מכוסה → הערכה חיצונית
  if (mine.every(function(l){ return l.calc === 'included'; })) return 'included';
  return 'extra';                                                     // בתוספת תשלום
}
var QSTATE_HE = {none:'לא טופל', included:'כלול', extra:'בתוספת', missing:'לא מכוסה'};

/* הלב: עלות ההצעה במספר אורחים נתון.
   הכל מחושב בנטו (לפני מע״מ) ורק בסוף מוסיפים מע״מ, כך שלא משנה
   אם ספק אחד נקב מחיר כולל מע״מ והשני לא. */
function computeQuote(q, allLines, guests, vatPct){
  q = q || {};
  var v    = 1 + qNum(vatPct,0)/100;
  var all  = allLines || [];
  var own  = all.filter(function(l){ return l.quoteId === q.id; });
  /* עלות קבועה נכנסת להצעה רק אם להצעה עצמה אין שורה באותה קטגוריה.
     אולם שכולל הגברה גובר על הדי־ג׳יי החיצוני — ולא נספור את שניהם. */
  var mine = {};
  own.forEach(function(l){ mine[l.cat||'אחר'] = 1; });
  var isShared = {};
  var shared = q.id === QFIXED ? [] : all.filter(function(l){
    return l.quoteId === QFIXED && !mine[l.cat||'אחר'];
  });
  shared.forEach(function(l){ isShared[l.id] = 1; });
  var lines = own.concat(shared);
  var minG  = Math.round(qNum(q.minGuests,0));
  var mode  = q.minMode === 'penalty' ? 'penalty' : 'max';
  guests    = Math.max(0, Math.round(qNum(guests,0)));
  /* מינימום מחויב בשיטת max: המנות מחויבות לפי הגבוה מבין השניים.
     שורות מדרגה (מלצרים, שירותים) נספרות לפי האורחים שבאמת מגיעים. */
  var billed = mode === 'max' ? Math.max(guests, minG) : guests;

  var rows = lines.map(function(l){
    var raw  = qNum(l.amount,0);
    var unit = l.calc === 'percent' ? raw : (l.vatInc ? raw / v : raw);
    var qty = 0, net = 0, formula = '';
    if (l.calc === 'included'){
      formula = 'כלול במחיר ההצעה';
    } else if (l.calc === 'perGuest'){
      qty = billed; net = unit * billed;
      formula = billed + ' אורחים × ' + nis(unit) + (billed > guests ? ' — לפי המינימום' : '');
    } else if (l.calc === 'tier'){
      var per = Math.max(1, Math.round(qNum(l.per,1)));
      qty = Math.ceil(guests / per); net = unit * qty;
      formula = 'ceil(' + guests + '/' + per + ') = ' + qty + ' × ' + nis(unit);
    } else if (l.calc === 'percent'){
      qty = 1;                                     // מחושב במעבר השני
    } else {
      qty = 1; net = unit; formula = 'סכום קבוע';
    }
    return {line:l, cat:l.cat||'אחר', qty:qty, unitNet:(l.calc==='percent'?0:unit), net:net, formula:formula,
            ext:!!l.ext, shared:!!isShared[l.id], blank: l.calc !== 'included' && qNum(l.amount,0) === 0};
  });

  /* מעבר שני — שורות אחוז. הבסיס הוא סכום השורות שאינן אחוז ואינן
     הערכה חיצונית (לא משלמים טיפ על משהו שקנינו בחוץ), ואפשר להגביל
     לקטגוריה אחת (למשל טיפ רק על האוכל). */
  rows.forEach(function(r){
    if (r.line.calc !== 'percent') return;
    var only = r.line.pctOf || '';
    var base = rows.reduce(function(a, o){
      if (o.line.calc === 'percent' || o.ext || o.shared) return a;
      if (only && o.cat !== only) return a;
      return a + o.net;
    }, 0);
    var raw = base * qNum(r.line.amount,0) / 100;
    r.net = r.line.vatInc ? raw / v : raw;
    r.unitNet = r.net;
    r.formula = qNum(r.line.amount,0) + '% מתוך ' + nis(base) + (only ? ' · ' + only : ' (כל השורות)');
  });

  /* מינימום מחויב — כמה כסף נשרף על אורחים שלא הגיעו */
  var burnGuests = 0, burnCost = 0;
  if (mode === 'max'){
    burnGuests = Math.max(0, billed - guests);
    var perHead = rows.reduce(function(a,r){ return a + (r.line.calc==='perGuest' ? r.unitNet : 0); }, 0);
    burnCost = burnGuests * perHead * v;
  } else if (minG > guests){
    burnGuests = minG - guests;
    var pen = qNum(q.penaltyPer,0) / (q.penaltyVatInc ? v : 1);
    burnCost = burnGuests * pen * v;
    if (pen > 0) rows.push({
      line:{id:'__pen__'+q.id, quoteId:q.id, cat:'מינימום מובטח', desc:'קנס על אורחים חסרים', calc:'fixed', synth:true},
      cat:'מינימום מובטח', qty:burnGuests, unitNet:pen, net:burnGuests*pen, ext:false,
      formula:'(' + minG + ' − ' + guests + ') = ' + burnGuests + ' × ' + nis(pen)
    });
  }

  rows.forEach(function(r){ r.gross = r.net * v; });

  var sum = function(pred){ return rows.reduce(function(a,r){ return pred(r) ? a + r.gross : a; }, 0); };
  var quoted     = sum(function(r){ return !r.ext && !r.shared; });
  var sharedCost = sum(function(r){ return  r.shared; });
  var estimated  = sum(function(r){ return  r.ext; });
  var isFixed    = function(r){ return r.line.calc === 'fixed'; };
  var total      = quoted + sharedCost + estimated;

  var byCat = {};
  rows.forEach(function(r){
    var c = byCat[r.cat] || (byCat[r.cat] = {gross:0, ext:0, included:false, blank:true, shared:false, rows:[]});
    c.gross += r.gross; if (r.ext) c.ext += r.gross;
    if (r.line.calc === 'included') c.included = true;
    if (r.shared) c.shared = true;
    if (!r.blank) c.blank = false;
    c.rows.push(r);
  });

  return {
    quote:q, rows:rows, byCat:byCat, vat:qNum(vatPct,0),
    guests:guests, billed:billed, minGuests:minG, minMode:mode,
    burnGuests:burnGuests, burnCost:burnCost,
    quoted:quoted, sharedCost:sharedCost, estimated:estimated, total:total,
    fixed: sum(isFixed), variable: sum(function(r){ return !isFixed(r); }),
    perGuest: guests ? total / guests : 0
  };
}

/* ─────────── בדיקות לנוסחאות ─────────── */
/* אין כאן שרת בנייה, ולכן הבדיקות חיות באותו קובץ ורצות בדפדפן
   מהכפתור "בדיקות" בפס הפרמטרים — על אותן פונקציות שה-UI קורא להן. */
function runQuoteTests(){
  var T = [], near = function(a,b){ return Math.abs(a-b) < 0.01; };
  var chk = function(name, got, want){ T.push({name:name, ok:near(got,want), got:Math.round(got*100)/100, want:want}); };
  var eq  = function(name, got, want){ T.push({name:name, ok:got===want, got:got, want:want}); };
  var Q = function(o){ return Object.assign({id:'q', minGuests:0, minMode:'max'}, o||{}); };
  var L = function(o){ return Object.assign({id:'l'+T.length+Math.random(), quoteId:'q', cat:'אחר', calc:'fixed', amount:0, vatInc:false, ext:false}, o); };

  /* בסיס — בלי מע״מ, כדי לבודד את הנוסחה עצמה */
  chk('קבוע', computeQuote(Q(), [L({calc:'fixed', amount:5000})], 300, 0).total, 5000);
  chk('לפי אורח: 300 × 450', computeQuote(Q(), [L({calc:'perGuest', amount:450})], 300, 0).total, 135000);

  /* מדרגות */
  chk('מדרגות: ceil(480/15) × 450', computeQuote(Q(), [L({calc:'tier', per:15, amount:450})], 480, 0).total, 32*450);
  eq('מדרגות מתעגלות למעלה (201/100 → 3)', computeQuote(Q(), [L({calc:'tier', per:100, amount:900})], 201, 0).rows[0].qty, 3);
  eq('מדרגות: בדיוק על הגבול (200/100 → 2)', computeQuote(Q(), [L({calc:'tier', per:100, amount:900})], 200, 0).rows[0].qty, 2);

  /* אחוזים */
  chk('אחוז: 10% מ-10,000', computeQuote(Q(), [L({calc:'fixed', amount:10000}), L({calc:'percent', amount:10})], 100, 0).total, 11000);
  chk('אחוז מוגבל לקטגוריה', computeQuote(Q(), [L({cat:'אוכל', calc:'fixed', amount:10000}), L({cat:'תאורה', calc:'fixed', amount:5000}),
        L({cat:'מלצרים וצוות', calc:'percent', amount:10, pctOf:'אוכל'})], 100, 0).total, 16000);
  chk('אחוז לא חל על הערכה חיצונית', computeQuote(Q(), [L({calc:'fixed', amount:1000}),
        L({calc:'fixed', amount:9000, ext:true}), L({calc:'percent', amount:10})], 100, 0).total, 10100);

  /* מע״מ */
  chk('מע״מ 18% נוסף על מחיר נטו', computeQuote(Q(), [L({calc:'fixed', amount:1000})], 100, 18).total, 1180);
  chk('מחיר שכבר כולל מע״מ לא מנופח שוב', computeQuote(Q(), [L({calc:'fixed', amount:1180, vatInc:true})], 100, 18).total, 1180);
  chk('ערבוב: אחד עם ואחד בלי', computeQuote(Q(), [L({calc:'fixed', amount:1000}), L({calc:'fixed', amount:1180, vatInc:true})], 100, 18).total, 2360);

  /* כלול ונרמול */
  chk('"כלול" לא מוסיף עלות', computeQuote(Q(), [L({cat:'שירותים', calc:'included'})], 300, 18).total, 0);
  eq('"כלול" נספר ככיסוי', itemState([{cat:'שירותים', calc:'included'}], 'שירותים'), 'included');
  eq('פריט בלי שורה = לא טופל', itemState([], 'ביטוח'), 'none');
  eq('שורת הערכה = לא מכוסה', itemState([{cat:'ביטוח', calc:'fixed', ext:true}], 'ביטוח'), 'missing');
  eq('שורה בתשלום = בתוספת', itemState([{cat:'תאורה', calc:'fixed'}], 'תאורה'), 'extra');
  var nm = computeQuote(Q(), [L({cat:'אוכל', calc:'fixed', amount:100000}), L({cat:'ביטוח', calc:'fixed', amount:2500, ext:true})], 300, 0);
  chk('מנורמל = הצעה + הערכות', nm.total, 102500);
  chk('"מחיר לפי ההצעה" בלי ההערכות', nm.quoted, 100000);
  chk('חלק ההערכות', nm.estimated, 2500);

  /* מינימום — שיטת max */
  var mx = computeQuote(Q({minGuests:300, minMode:'max'}), [L({calc:'perGuest', amount:400})], 260, 0);
  chk('max: מחויבים 300 ולא 260', mx.total, 120000);
  eq('max: 40 אורחים נשרפים', mx.burnGuests, 40);
  chk('max: ₪16,000 נשרפו', mx.burnCost, 16000);
  chk('max: מעל המינימום משלמים בפועל',
      computeQuote(Q({minGuests:300, minMode:'max'}), [L({calc:'perGuest', amount:400})], 340, 0).total, 136000);
  eq('max: מעל המינימום שום דבר לא נשרף',
      computeQuote(Q({minGuests:300, minMode:'max'}), [L({calc:'perGuest', amount:400})], 340, 0).burnGuests, 0);
  eq('מדרגות לפי אורחים בפועל ולא לפי המינימום',
      computeQuote(Q({minGuests:300, minMode:'max'}), [L({calc:'tier', per:15, amount:450})], 150, 0).rows[0].qty, 10);

  /* מינימום — שיטת קנס */
  var pn = computeQuote(Q({minGuests:300, minMode:'penalty', penaltyPer:150}), [L({calc:'perGuest', amount:400})], 260, 0);
  chk('קנס: 260×400 + 40×150', pn.total, 260*400 + 40*150);
  chk('קנס: סכום שנשרף', pn.burnCost, 6000);
  chk('קנס: מעל המינימום אין קנס',
      computeQuote(Q({minGuests:300, minMode:'penalty', penaltyPer:150}), [L({calc:'perGuest', amount:400})], 320, 0).burnCost, 0);

  /* קבוע מול משתנה ועלות לאורח */
  var fv = computeQuote(Q(), [L({calc:'fixed', amount:20000}), L({calc:'perGuest', amount:100})], 300, 0);
  chk('חלק קבוע', fv.fixed, 20000);
  chk('חלק משתנה', fv.variable, 30000);
  chk('עלות לאורח', fv.perGuest, 50000/300);

  /* עלויות קבועות המשותפות לכל ההצעות */
  var F = function(o){ return Object.assign({id:'f'+Math.random(), quoteId:QFIXED, cat:'אחר', calc:'fixed', amount:0, vatInc:false, ext:false}, o); };
  chk('עלות קבועה נכנסת להצעה',
      computeQuote(Q(), [L({cat:'אוכל', calc:'fixed', amount:1000}), F({cat:'DJ והגברה', amount:8000})], 100, 0).total, 9000);
  chk('עלות קבועה נספרת בנפרד מהמחיר שההצעה נקבה',
      computeQuote(Q(), [L({cat:'אוכל', calc:'fixed', amount:1000}), F({cat:'DJ והגברה', amount:8000})], 100, 0).quoted, 1000);
  chk('החלק המשותף',
      computeQuote(Q(), [L({cat:'אוכל', calc:'fixed', amount:1000}), F({cat:'DJ והגברה', amount:8000})], 100, 0).sharedCost, 8000);
  /* הלב של "בלי כפילויות": אולם שכולל הגברה גובר על הדי־ג׳יי החיצוני */
  chk('שורה של ההצעה גוברת על העלות הקבועה — לא נספר פעמיים',
      computeQuote(Q(), [L({cat:'DJ והגברה', calc:'included'}), F({cat:'DJ והגברה', amount:8000})], 100, 0).total, 0);
  chk('גם שורה בתשלום של ההצעה גוברת',
      computeQuote(Q(), [L({cat:'DJ והגברה', calc:'fixed', amount:3000}), F({cat:'DJ והגברה', amount:8000})], 100, 0).total, 3000);
  eq('הצעה אחרת עדיין מקבלת את העלות הקבועה', (function(){
      var lines = [L({quoteId:'a', cat:'DJ והגברה', calc:'included'}), F({cat:'DJ והגברה', amount:8000})];
      return Math.round(computeQuote({id:'b'}, lines, 100, 0).total); })(), 8000);
  chk('טיפ של המקום לא חל על ספק חיצוני',
      computeQuote(Q(), [L({cat:'אוכל', calc:'fixed', amount:1000}), F({cat:'צלם סטילס', amount:9000}),
                         L({cat:'מלצרים וצוות', calc:'percent', amount:10})], 100, 0).total, 1000 + 9000 + 100);
  chk('מע״מ חל גם על עלות קבועה',
      computeQuote(Q(), [F({cat:'צלם סטילס', amount:1000})], 100, 18).total, 1180);

  /* תרחישים */
  eq('צפוי = 600 × 75%', scenarioGuests(600, 75, {}).exp, 450);
  eq('פסימי = 85% מהצפוי', scenarioGuests(600, 75, {}).pess, 383);
  eq('אופטימי לא עובר את מספר המוזמנים', scenarioGuests(400, 98, {}).opt, 400);
  eq('דריסה ידנית גוברת', scenarioGuests(600, 75, {exp:500}).exp, 500);

  return T;
}

/* ─────────── גישה לנתונים ולפרמטרים הגלובליים ─────────── */

function qVat(){ var v = setting('שיעור מע״מ'); return v === '' || v == null ? 18 : qNum(v, 18); }
function qScenSet(){
  var invited = qNum(setting('מוזמנים להשוואה'), 0) || stats().totalPeople;
  return scenarioGuests(invited, qNum(setting('אחוז הגעה צפוי'), 75), {
    pess: setting('תרחיש פסימי'), exp: setting('תרחיש צפוי'), opt: setting('תרחיש אופטימי')
  });
}
function qGuests(){ var s = qScenSet(); return s[S.qScen] || s.exp; }
function qLines(id){ return (S.quoteLines||[]).filter(function(l){ return l.quoteId === id; }); }
function qFixedLines(){ return qLines(QFIXED); }
function qFixedCats(){ var o = {}; qFixedLines().forEach(function(l){ o[l.cat||'אחר'] = 1; }); return o; }
function qFixedCalc(){ return computeQuote({id:QFIXED, minGuests:0}, S.quoteLines, qGuests(), qVat()); }
function qCalc(q, guests){ return computeQuote(q, S.quoteLines, guests == null ? qGuests() : guests, qVat()); }
function qColor(i){ return QCOLORS[i % QCOLORS.length]; }
function qList(){   // ההצעות להשוואה — נפסלות מוסתרות אלא אם ביקשו אחרת
  return (S.quotes||[]).filter(function(q){ return S.qRejected || q.status !== 'נפסל'; });
}
function qExtraItems(){
  return String(setting('פריטים נוספים')||'').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
}
/* רשימת הפריטים להשוואה: הרשימה הקבועה + מה שהוספנו + כל קטגוריה שכבר בשימוש */
function qItemList(){
  var seen = {}, out = [];
  var push = function(c){ if (c && !seen[c]){ seen[c] = 1; out.push(c); } };
  QITEMS.forEach(push); qExtraItems().forEach(push);
  (S.quoteLines||[]).forEach(function(l){ push(l.cat); });
  return out;
}
/* רק הפריטים שמישהו כבר נגע בהם — לטבלת ההשוואה, שלא תתפוצץ בשורות ריקות */
function qUsedItems(){
  var used = {};
  (S.quoteLines||[]).forEach(function(l){ used[l.cat||'אחר'] = 1; });
  (S.quotes||[]).forEach(function(q){ if (q.minMode === 'penalty' && qNum(q.penaltyPer,0) > 0) used['מינימום מובטח'] = 1; });
  return qItemList().concat(['מינימום מובטח']).filter(function(c){ return used[c]; });
}

/* ─────────── התצוגה הראשית ─────────── */
var QVIEWS = [['compare','השוואה'],['fixed','עלויות קבועות'],['norm','נרמול'],['sens','רגישות'],
              ['scen','תרחישים'],['detail','פירוט'],['tests','בדיקות']];

function vQuotes(){
  var body = S.quotes.length || S.qView === 'tests' || S.qView === 'fixed' ? {
    compare: qvCompare, fixed: qvFixed, norm: qvNorm, sens: qvSens,
    scen: qvScen, detail: qvDetail, tests: qvTests
  }[S.qView || 'compare']() : qvEmpty();
  return '<div class="grid">' + qParams() +
    '<div class="seg" style="align-self:flex-start">' + QVIEWS.map(function(v){
      return '<button data-act="q.view" data-v="'+v[0]+'"'+(S.qView===v[0]?' class="on"':'')+'>'+v[1]+'</button>';
    }).join('') + '</div>' + body + '</div>';
}

function qvEmpty(){
  return '<div class="card" style="padding:40px 26px;text-align:center">'+
    '<div class="serif" style="font-size:22px;font-weight:700;margin-bottom:8px">עוד אין הצעות להשוות</div>'+
    '<div class="muted" style="max-width:520px;margin:0 auto 20px;line-height:1.8">'+
      'התחילו מתבנית — היא כבר מביאה את השורות הנפוצות עם סכומים ריקים, '+
      'ואתם רק ממלאים את המספרים מההצעה שקיבלתם.</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+
      '<button class="btn primary" data-act="q.add" data-tpl="גן/אולם">+ הצעה מתבנית גן/אולם</button>'+
      '<button class="btn primary" data-act="q.add" data-tpl="שטח">+ הצעה מתבנית שטח</button>'+
      '<button class="btn" data-act="q.add" data-tpl="">+ הצעה ריקה</button></div></div>';
}

/* ─────────── פס הפרמטרים הגלובליים ─────────── */
function qParams(){
  var s = qScenSet(), k = stats(), vat = qVat();
  var fld = function(label, act, val, sub, ph){
    return '<label class="qf"><span>'+label+'</span>'+
      '<input type="number" data-act="'+act+'" data-k="'+act+'" value="'+(val===''||val==null?'':val)+'"'+
        (ph ? ' placeholder="'+esc(ph)+'"' : '')+'>'+
      (sub ? '<i>'+esc(sub)+'</i>' : '')+'</label>';
  };
  var scen = QSCEN.map(function(x){
    var on = S.qScen === x[0];
    return '<button class="qscen'+(on?' on':'')+'" data-act="q.scen" data-v="'+x[0]+'">'+
      '<b>'+s[x[0]].toLocaleString('he-IL')+'</b><span>'+x[1]+'</span></button>';
  }).join('');

  return '<div class="card" style="padding:16px 18px">'+
    '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px">'+
      '<div style="font-size:15px;font-weight:700">פרמטרים להשוואה</div>'+
      '<div class="muted">כל שינוי כאן מעדכן מיד את כל ההצעות. כל הסכומים בלוח מוצגים <b>כולל מע״מ</b>.</div>'+
      '<span style="flex:1"></span>'+
      '<button class="btn sm" data-act="q.add" data-tpl="גן/אולם">+ גן/אולם</button>'+
      '<button class="btn sm" data-act="q.add" data-tpl="שטח">+ שטח</button>'+
      '<button class="btn sm" data-act="q.add" data-tpl="">+ ריקה</button>'+
    '</div>'+
    '<div class="qparams">'+
      fld('מוזמנים', 'q.invited', setting('מוזמנים להשוואה')||'', 'ברשימה: '+k.totalPeople, String(k.totalPeople))+
      fld('% הגעה צפוי', 'q.attend', setting('אחוז הגעה צפוי')===''?'':qNum(setting('אחוז הגעה צפוי'),75), 'צפי משוקלל: '+k.expected)+
      fld('מע״מ %', 'q.vat', vat, 'חל על שורות שסומנו "לפני מע״מ"')+
      fld('פסימי', 'q.pess', setting('תרחיש פסימי')||'', 'ריק = אוטומטי', String(s.pess))+
      fld('צפוי', 'q.exp', setting('תרחיש צפוי')||'', 'ריק = '+s.base, String(s.base))+
      fld('אופטימי', 'q.opt', setting('תרחיש אופטימי')||'', 'ריק = אוטומטי', String(s.opt))+
    '</div>'+
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line3)">'+
      '<span class="muted">התרחיש שמוצג:</span><div class="qscens">'+scen+'</div>'+
      '<button class="btn sm" data-act="q.sync" title="לוקח את מספר המוזמנים מרשימת המוזמנים ומאפס דריסות ידניות">רענן מרשימת המוזמנים</button>'+
      '<span style="flex:1"></span>'+
      '<label style="display:flex;align-items:center;gap:6px;font-size:13px">'+
        '<input type="checkbox" class="ck" data-act="q.rejected"'+(S.qRejected?' checked':'')+'> הצג גם נפסלות</label>'+
    '</div></div>';
}

/* ─────────── 1. טבלת השוואה ─────────── */
function qvCompare(){
  var list = qList();
  if (!list.length) return qvEmpty();
  var g = qGuests(), items = qUsedItems();
  var C = list.map(function(q){ return qCalc(q, g); });
  var cheapest = Math.min.apply(null, C.map(function(c){ return c.total; }));

  var head = '<tr><th style="min-width:150px">קטגוריה</th>' + list.map(function(q,i){
    var st = QSTAT_STYLE[q.status] || QSTAT_STYLE['בבדיקה'];
    return '<th style="min-width:150px;border-top:3px solid '+qColor(i)+'">'+
      '<div style="font-size:14px;font-weight:700;color:var(--ink)">'+esc(q.name||'ללא שם')+'</div>'+
      '<div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;font-weight:400">'+
        '<span class="pill" style="background:'+st.bg+';color:'+st.fg+'">'+esc(q.status||'בבדיקה')+'</span>'+
        '<span style="font-size:11px">'+esc(q.kind||'')+'</span></div>'+
      '<button class="btn sm" style="margin-top:6px;padding:4px 12px;font-size:11.5px;font-weight:600" '+
        'data-act="q.edit" data-id="'+q.id+'">ערוך</button></th>';
  }).join('') + '</tr>';

  var shCats = qFixedCats();
  var body = items.map(function(item){
    return '<tr><td style="font-size:13px;font-weight:600">'+esc(item)+
      (shCats[item] ? '<span class="qtag qshared">קבוע</span>' : '')+'</td>' + C.map(function(c){
      var cell = c.byCat[item];
      if (!cell) return '<td class="qmiss">—</td>';
      var est = cell.ext > 0;
      var zero = cell.gross < 0.5;
      if (zero && cell.included) return '<td class="qinc">כלול</td>';
      if (zero && cell.blank)    return '<td class="qpend">טרם הוזן</td>';
      return '<td class="'+(est?'qest':'')+'" style="font-size:13px;font-weight:600">'+nis(cell.gross)+
        (est ? '<div style="font-size:10.5px;font-weight:600">הערכה</div>' : '')+'</td>';
    }).join('') + '</tr>';
  }).join('');

  var sumRow = function(label, fn, cls, sub){
    return '<tr class="'+(cls||'')+'"><td style="font-size:13px;font-weight:600">'+label+
      (sub?'<div class="muted" style="font-size:11px;font-weight:400">'+sub+'</div>':'')+'</td>'+
      C.map(function(c,i){ return '<td>'+fn(c,i)+'</td>'; }).join('')+'</tr>';
  };

  return '<div class="card" style="overflow:hidden">'+
    '<div class="toolbar"><div style="font-size:15px;font-weight:700;flex:1">השוואה ב־'+g.toLocaleString('he-IL')+' אורחים · תרחיש '+QSCEN_HE[S.qScen]+'</div>'+
      '<span class="qlegend"><i class="qest"></i> הערכה חיצונית</span>'+
      '<span class="qlegend"><i class="qinc"></i> כלול במחיר</span>'+
      '<span class="qlegend"><i class="qmiss"></i> לא טופל</span></div>'+
    '<div class="tblscroll" style="overflow-x:auto"><table class="t qcmp"><thead>'+head+'</thead>'+
      '<tbody>'+body+'</tbody><tfoot>'+
      sumRow('מחיר לפי ההצעה', function(c){ return '<span style="font-size:13px">'+nis(c.quoted)+'</span>'; })+
      sumRow('עלויות קבועות', function(c){ return c.sharedCost ? '<span style="font-size:13px">+ '+nis(c.sharedCost)+'</span>' : '<span class="muted">—</span>'; },
             '', 'ספקים שזהים בכל ההצעות')+
      sumRow('השלמות בהערכה', function(c){ return c.estimated ? '<span class="qesttx">+ '+nis(c.estimated)+'</span>' : '<span class="muted">—</span>'; },
             '', 'מה שההצעה לא כוללת')+
      sumRow('סה״כ מנורמל', function(c,i){
        var d = c.total - cheapest;
        return '<div class="qtot" style="color:'+(d<0.5?'var(--green)':'var(--ink)')+'">'+nis(c.total)+'</div>'+
               '<div style="font-size:11.5px;color:'+(d<0.5?'var(--green)':'var(--clay)')+';font-weight:600">'+
               (d<0.5 ? 'הזולה ביותר' : '+ '+nis(d))+'</div>';
      }, 'qtotrow')+
      sumRow('עלות לאורח', function(c){ return '<span style="font-size:13px;font-weight:600">'+nis(c.perGuest)+'</span>'; })+
      sumRow('קבוע / משתנה', function(c){
        var t = c.total || 1, fp = Math.round(c.fixed/t*100);
        return '<div style="font-size:12px">'+nis(c.fixed)+' / '+nis(c.variable)+'</div>'+
          '<div class="qsplit"><i style="width:'+fp+'%"></i></div>'+
          '<div style="font-size:11px;color:var(--muted)">'+fp+'% קבוע</div>';
      })+
      sumRow('מינימום מחויב', function(c){
        if (!c.minGuests) return '<span class="muted">אין</span>';
        return '<div style="font-size:12.5px">'+c.minGuests+' אורחים</div>'+
          '<div style="font-size:11.5px;color:var(--muted)">'+(c.minMode==='max'?'חיוב לפי המינימום':'קנס לאורח חסר')+'</div>';
      })+
      sumRow('כסף שנשרף על מי שלא בא', function(c){
        return c.burnGuests ? '<span style="font-size:13px;font-weight:700;color:var(--clay)">'+nis(c.burnCost)+'</span>'+
          '<div style="font-size:11px;color:var(--muted)">'+c.burnGuests+' אורחים חסרים</div>'
          : '<span class="muted">—</span>';
      })+
      ((S.quotes||[]).some(function(q){ return qNum(q.paid,0) || qNum(q.deposit,0); }) ?
        sumRow('שולם עד היום', function(c){
          var p = qNum(c.quote.paid,0);
          return '<div style="font-size:13px">'+nis(p)+'</div>'+
                 '<div style="font-size:11px;color:var(--muted)">נותר '+nis(Math.max(0,c.total-p))+'</div>';
        }) : '')+
      '</tfoot></table></div></div>';
}

/* ─────────── עלויות קבועות, זהות בכל ההצעות ─────────── */
function qvFixed(){
  var fl = qFixedLines(), fc = qFixedCalc(), items = qItemList(), g = qGuests();
  var rows = fl.map(function(l){
    return qLineRow(l, fc.rows.filter(function(x){ return x.line.id === l.id; })[0], items);
  }).join('') || '<div class="muted" style="padding:14px 0">עוד אין עלויות קבועות. '+
      'אפשר לייבא את מה שכבר רשום בלשונית "ספקים", או להוסיף שורה ידנית.</div>';

  return '<div class="card" style="padding:18px 20px">'+
    '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px">'+
      '<div style="font-size:15px;font-weight:700">עלויות קבועות — זהות בכל ההצעות</div>'+
      '<span style="flex:1"></span>'+
      '<div class="serif" style="font-size:20px;font-weight:700">'+nis(fc.total)+'</div></div>'+
    '<div class="muted" style="line-height:1.8;margin-bottom:14px">'+
      'די־ג׳יי, צלם, איפור, מגנטים, רב — כל מה שלא תלוי במקום. רושמים פעם אחת, '+
      'והסכום נכנס אוטומטית לכל ההצעות. '+
      '<b>הצעה שכוללת את הפריט בעצמה גוברת</b> — אם לאולם יש הגברה משלו, סמנו אצלו '+
      '"DJ והגברה" ככלול, והדי־ג׳יי החיצוני לא ייספר לו פעמיים.</div>'+
    '<datalist id="qitemlist">'+items.map(function(i){ return '<option value="'+esc(i)+'">'; }).join('')+'</datalist>'+
    '<div style="display:flex;flex-direction:column;gap:10px">'+rows+'</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center">'+
      '<button class="btn sm primary" data-act="q.f.add">+ עלות קבועה</button>'+
      '<button class="btn sm" data-act="q.f.vendors" title="יוצר שורה לכל ספק שכבר רשום בלשונית ספקים">ייבא מלשונית ספקים</button>'+
      '<span style="font-size:12.5px;color:var(--green)">'+esc(S.qMsg||'')+'</span></div>'+
    '<div class="qsumline tot" style="margin-top:14px"><span>מתווסף לכל הצעה ב־'+g+' אורחים</span><b>'+nis(fc.total)+'</b></div>'+
  '</div>';
}

/* ─────────── 2. נרמול וכיסוי ─────────── */
function qvNorm(){
  var list = qList();
  if (!list.length) return qvEmpty();
  var g = qGuests(), items = qItemList();
  var C = list.map(function(q){ return qCalc(q, g); });

  var rows = items.map(function(item){
    return '<tr><td style="font-size:13px;font-weight:600;min-width:150px">'+esc(item)+'</td>'+
      list.map(function(q, i){
        var lines = qLines(q.id).filter(function(l){ return l.cat === item; });
        var st = itemState(qLines(q.id), item);
        var cell = C[i].byCat[item];
        var sel = '<select class="sel qcov" data-act="q.cov" data-id="'+q.id+'" data-item="'+esc(item)+'">'+
          [['none','—'],['included','כלול'],['extra','בתוספת'],['missing','לא מכוסה']].map(function(o){
            return '<option value="'+o[0]+'"'+(st===o[0]?' selected':'')+'>'+o[1]+'</option>';
          }).join('')+'</select>';
        var money = '';
        if (st === 'none' && C[i].byCat[item] && C[i].byCat[item].shared)
          money = '<div class="qtag qshared" style="margin-top:5px;display:inline-block">קבוע · '+nis(C[i].byCat[item].gross)+'</div>';
        if (st === 'extra' || st === 'missing'){
          money = lines.length === 1
            ? '<input type="number" class="num" style="width:82px;margin-top:5px" data-act="q.l.amount" data-id="'+lines[0].id+'" data-k="qn'+lines[0].id+'" value="'+(qNum(lines[0].amount,0)||'')+'" placeholder="0">'+
              '<div style="font-size:10.5px;color:var(--muted);margin-top:2px">'+QCALC_HE[lines[0].calc]+' → '+nis(cell?cell.gross:0)+'</div>'
            : '<div style="font-size:11.5px;margin-top:5px">'+lines.length+' שורות · <b>'+nis(cell?cell.gross:0)+'</b></div>';
        }
        return '<td class="'+(st==='missing'?'qest':st==='none'?'qmiss':'')+'" style="text-align:center">'+sel+money+'</td>';
      }).join('')+'</tr>';
  }).join('');

  return '<div class="card" style="overflow:hidden">'+
    '<div class="toolbar"><div style="font-size:15px;font-weight:700;flex:1">מה כל הצעה באמת כוללת</div>'+
      '<input class="field" style="width:190px" placeholder="הוסף פריט להשוואה…" data-act="q.newItem" data-k="qNewItem" value="'+esc(S.qNewItem||'')+'">'+
      '<button class="btn sm" data-act="q.addItem">הוסף</button></div>'+
    '<div style="padding:12px 20px;font-size:12.5px;color:var(--muted);line-height:1.8;border-bottom:1px solid var(--line2)">'+
      '<b>כלול</b> — בתוך המחיר, עלות 0. <b>בתוספת</b> — ההצעה נותנת את זה בתשלום נפרד. '+
      '<b>לא מכוסה</b> — צריך להביא מבחוץ, והסכום שתזינו הוא הערכה שמתווספת לסך המנורמל ומסומנת בצהוב. '+
      '<b>—</b> עדיין לא בדקנו.</div>'+
    '<div class="tblscroll" style="overflow-x:auto"><table class="t qcmp"><thead><tr><th>פריט</th>'+
      list.map(function(q,i){ return '<th style="min-width:130px;border-top:3px solid '+qColor(i)+'">'+esc(q.name||'ללא שם')+'</th>'; }).join('')+
    '</tr></thead><tbody>'+rows+'</tbody><tfoot>'+
      '<tr class="qtotrow"><td style="font-weight:600;font-size:13px">סה״כ מנורמל</td>'+
        C.map(function(c){ return '<td><div class="qtot">'+nis(c.total)+'</div>'+
          (c.estimated ? '<div class="qesttx" style="font-size:11.5px">כולל '+nis(c.estimated)+' בהערכה</div>' : '')+'</td>'; }).join('')+
      '</tr></tfoot></table></div></div>';
}

/* ─────────── 3. גרף רגישות ─────────── */
function qvSens(){
  var list = qList();
  if (!list.length) return qvEmpty();
  var s = qScenSet();
  var lo = qNum(setting('טווח גרף מ'),0) || Math.max(50, Math.floor(Math.min(s.pess, s.exp) * 0.65 / 25) * 25);
  var hi = qNum(setting('טווח גרף עד'),0) || Math.max(lo + 100, Math.ceil(s.opt * 1.35 / 25) * 25);
  var step = Math.max(1, Math.round((hi - lo) / 60));

  var xs = [], n;
  for (n = lo; n <= hi; n += step) xs.push(n);
  if (xs[xs.length-1] !== hi) xs.push(hi);

  var series = list.map(function(q, i){
    return {q:q, color:qColor(i), ys:xs.map(function(x){ return qCalc(q, x).total; })};
  });
  var maxY = Math.max.apply(null, series.reduce(function(a,se){ return a.concat(se.ys); }, [1]));
  maxY = Math.ceil(maxY * 1.06 / 10000) * 10000 || 10000;

  var W = 960, H = 420, ML = 78, MR = 18, MT = 18, MB = 46;
  var px = function(x){ return ML + (x - lo) / (hi - lo || 1) * (W - ML - MR); };
  var py = function(y){ return MT + (1 - y / maxY) * (H - MT - MB); };

  /* נקודות חיתוך — היכן שההצעה הזולה ביותר מתחלפת */
  var cheapAt = function(idx){
    var best = 0;
    series.forEach(function(se, j){ if (se.ys[idx] < series[best].ys[idx]) best = j; });
    return best;
  };
  var cross = [];
  for (n = 1; n < xs.length; n++){
    var a = cheapAt(n-1), b = cheapAt(n);
    if (a !== b) cross.push({x:xs[n], from:series[a], to:series[b]});
  }

  var gridY = '', ticks = 5;
  for (n = 0; n <= ticks; n++){
    var yv = maxY * n / ticks, yy = py(yv);
    gridY += '<line x1="'+ML+'" y1="'+yy+'" x2="'+(W-MR)+'" y2="'+yy+'" stroke="#EFEBE4"></line>'+
      '<text x="'+(ML-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#8C857B">'+
      (yv >= 1000 ? Math.round(yv/1000)+'K' : Math.round(yv))+'</text>';
  }
  var gridX = '';
  for (n = 0; n <= 6; n++){
    var xv = Math.round(lo + (hi-lo) * n / 6), xx = px(xv);
    gridX += '<line x1="'+xx+'" y1="'+MT+'" x2="'+xx+'" y2="'+(H-MB)+'" stroke="#F4F0EA"></line>'+
      '<text x="'+xx+'" y="'+(H-MB+18)+'" text-anchor="middle" font-size="11" fill="#8C857B">'+xv+'</text>';
  }

  /* קווי המינימום של כל הצעה + קווי התרחישים */
  var marks = series.map(function(se){
    var m = Math.round(qNum(se.q.minGuests,0));
    if (!m || m < lo || m > hi) return '';
    return '<line x1="'+px(m)+'" y1="'+MT+'" x2="'+px(m)+'" y2="'+(H-MB)+'" stroke="'+se.color+'" stroke-dasharray="3 4" opacity=".55"></line>'+
      '<text x="'+px(m)+'" y="'+(MT+12)+'" text-anchor="middle" font-size="10" fill="'+se.color+'">מינ׳ '+m+'</text>';
  }).join('');
  var scen = QSCEN.map(function(x){
    var v = s[x[0]]; if (v < lo || v > hi) return '';
    return '<line x1="'+px(v)+'" y1="'+MT+'" x2="'+px(v)+'" y2="'+(H-MB)+'" stroke="#23201C" stroke-dasharray="2 5" opacity=".28"></line>'+
      '<text x="'+px(v)+'" y="'+(H-MB-6)+'" text-anchor="middle" font-size="10" fill="#8C857B">'+x[1]+'</text>';
  }).join('');

  var paths = series.map(function(se){
    var d = se.ys.map(function(y, j){ return (j?'L':'M') + px(xs[j]).toFixed(1) + ' ' + py(y).toFixed(1); }).join(' ');
    return '<path d="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="2.4" stroke-linejoin="round"></path>';
  }).join('');
  var dots = cross.map(function(c){
    return '<circle cx="'+px(c.x)+'" cy="'+py(c.to.ys[xs.indexOf(c.x)])+'" r="5" fill="#FFF" stroke="'+c.to.color+'" stroke-width="2.4"></circle>';
  }).join('');

  var legend = series.map(function(se){
    var at = qCalc(se.q, qGuests()).total;
    return '<div style="display:flex;align-items:center;gap:8px">'+
      '<span style="width:16px;height:3px;border-radius:2px;background:'+se.color+'"></span>'+
      '<span style="font-size:13px;flex:1">'+esc(se.q.name||'ללא שם')+'</span>'+
      '<span style="font-size:12.5px;font-weight:700">'+nis(at)+'</span></div>';
  }).join('');

  var notes = cross.length ? cross.map(function(c){
    return '<li>מעל <b>'+c.x+'</b> אורחים — <b style="color:'+c.to.color+'">'+esc(c.to.q.name||'')+'</b> זולה יותר מ־'+esc(c.from.q.name||'')+'.</li>';
  }).join('') : '<li>אין נקודת חיתוך בטווח הזה — אותה הצעה נשארת הזולה לכל אורך הסקאלה.</li>';

  return '<div class="card" style="padding:18px 20px">'+
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px">'+
      '<div style="font-size:15px;font-weight:700;flex:1">עלות כוללת מנורמלת לפי מספר אורחים</div>'+
      '<label class="qf" style="width:108px"><span>טווח מ</span><input type="number" data-act="q.rangeLo" data-k="q.rangeLo" value="'+(setting('טווח גרף מ')||'')+'" placeholder="'+lo+'"></label>'+
      '<label class="qf" style="width:108px"><span>עד</span><input type="number" data-act="q.rangeHi" data-k="q.rangeHi" value="'+(setting('טווח גרף עד')||'')+'" placeholder="'+hi+'"></label>'+
    '</div>'+
    '<div dir="ltr" style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:600px;height:auto;display:block">'+
      gridY + gridX + marks + scen + paths + dots +
      '<line x1="'+ML+'" y1="'+(H-MB)+'" x2="'+(W-MR)+'" y2="'+(H-MB)+'" stroke="#E4DED4"></line>'+
      '<text x="'+((ML+W-MR)/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="11" fill="#8C857B">מספר אורחים</text>'+
    '</svg></div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 24px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line3)">'+legend+'</div>'+
    '<ul style="margin:14px 0 0;padding-inline-start:20px;font-size:13px;line-height:2;color:#4A443C">'+notes+'</ul>'+
    '<div class="muted" style="margin-top:8px">הקווים המקווקווים הצבעוניים הם המינימום המחויב של כל הצעה — משמאלם העלות לא יורדת יותר.</div>'+
  '</div>';
}

/* ─────────── 4. תרחישים ─────────── */
function qvScen(){
  var list = qList();
  if (!list.length) return qvEmpty();
  var s = qScenSet();
  var cols = QSCEN.map(function(x){
    var g = s[x[0]];
    var res = list.map(function(q){ return qCalc(q, g); });
    var min = Math.min.apply(null, res.map(function(c){ return c.total; }));
    return {key:x[0], label:x[1], guests:g, res:res, min:min};
  });

  var rows = list.map(function(q, i){
    return '<tr><td style="font-size:13.5px;font-weight:600;border-inline-start:3px solid '+qColor(i)+'">'+esc(q.name||'ללא שם')+
      '<div class="muted" style="font-size:11.5px">'+esc(q.kind||'')+'</div></td>'+
      cols.map(function(col){
        var c = col.res[i], best = c.total <= col.min + 0.5;
        return '<td'+(best?' class="qbest"':'')+'>'+
          '<div style="font-size:14px;font-weight:700">'+nis(c.total)+'</div>'+
          '<div style="font-size:11.5px;color:var(--muted)">'+nis(c.perGuest)+' לאורח</div>'+
          (c.burnGuests ? '<div style="font-size:11px;color:var(--clay)">נשרף '+nis(c.burnCost)+'</div>' : '')+
        '</td>';
      }).join('')+'</tr>';
  }).join('');

  return '<div class="card" style="overflow:hidden">'+
    '<div class="toolbar"><div style="font-size:15px;font-weight:700">אותה השוואה בשלושה תרחישים</div></div>'+
    '<div class="tblscroll" style="overflow-x:auto"><table class="t qcmp"><thead><tr><th>הצעה</th>'+
      cols.map(function(c){ return '<th style="min-width:150px"><div style="font-size:14px;color:var(--ink)">'+c.label+'</div>'+
        '<div style="font-weight:400">'+c.guests.toLocaleString('he-IL')+' אורחים</div></th>'; }).join('')+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="foot"><span class="muted">התא הירוק בכל עמודה הוא ההצעה הזולה באותו תרחיש. '+
      'אם הזוכה מתחלף בין תרחישים — כדאי להסתכל בגרף הרגישות כדי לראות איפה בדיוק נקודת המפנה.</span></div></div>';
}

/* ─────────── 5. פירוט הצעות ─────────── */
function qvDetail(){
  var list = qList();
  if (!list.length) return qvEmpty();
  var g = qGuests();
  return '<div class="grid">' + list.map(function(q, i){
    var c = qCalc(q, g), open = !!(S.qOpen||{})[q.id];
    var st = QSTAT_STYLE[q.status] || QSTAT_STYLE['בבדיקה'];
    var byCat = {};
    c.rows.forEach(function(r){ (byCat[r.cat] = byCat[r.cat] || []).push(r); });

    var lines = Object.keys(byCat).map(function(cat){
      return '<div class="qcat"><div class="qcath">'+esc(cat)+'<span>'+
          nis(byCat[cat].reduce(function(a,r){ return a+r.gross; },0))+'</span></div>'+
        byCat[cat].map(function(r){
          var tag = r.line.calc === 'included' ? '<span class="qtag qinc">כלול</span>'
                  : r.ext ? '<span class="qtag qest">הערכה חיצונית</span>' : '';
          if (r.shared) tag += '<span class="qtag qshared">עלות קבועה</span>';
          if (r.blank) tag += '<span class="qtag qpend">טרם הוזן</span>';
          return '<div class="qline">'+
            '<div class="qlmain"><b>'+esc(r.line.desc || QCALC_HE[r.line.calc] || '')+'</b> '+tag+
              (r.line.note ? '<div class="muted" style="font-size:11.5px">'+esc(r.line.note)+'</div>' : '')+'</div>'+
            '<div class="qlcalc">'+esc(r.formula)+'</div>'+
            '<div class="qlsum">'+nis(r.gross)+'</div></div>';
        }).join('')+'</div>';
    }).join('') || '<div class="muted" style="padding:14px 0">אין עדיין שורות עלות בהצעה הזו.</div>';

    var meta = [
      q.contact  ? ['איש קשר', q.contact] : null,
      q.eventDate? ['תאריך האירוע', q.eventDate + (q.weekday ? ' · ' + q.weekday : '')] : (q.weekday ? ['יום', q.weekday] : null),
      q.quoteDate? ['תאריך ההצעה', q.quoteDate] : null,
      q.validUntil ? ['בתוקף עד', q.validUntil] : null,
      q.minGuests ? ['מינימום', q.minGuests + ' אורחים · ' + (q.minMode==='penalty' ? 'קנס '+nis(q.penaltyPer)+' לאורח חסר' : 'חיוב לפי המינימום')] : null,
      qNum(q.deposit,0) ? ['מקדמה', nis(q.deposit)] : null,
      qNum(q.paid,0) ? ['שולם עד היום', nis(q.paid) + ' · נותר ' + nis(Math.max(0, c.total - qNum(q.paid,0)))] : null,
      q.payTerms ? ['מועדי תשלום', q.payTerms] : null
    ].filter(Boolean).map(function(m){
      return '<div class="qmeta"><span>'+m[0]+'</span><b>'+esc(String(m[1]))+'</b></div>';
    }).join('');

    return '<div class="card" style="padding:18px 20px;border-top:3px solid '+qColor(i)+'">'+
      '<div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap">'+
        '<div style="flex:1;min-width:170px">'+
          '<div class="serif" style="font-size:20px;font-weight:700">'+esc(q.name||'ללא שם')+'</div>'+
          '<div style="display:flex;align-items:center;gap:7px;margin-top:5px;flex-wrap:wrap">'+
            '<span class="pill" style="background:'+st.bg+';color:'+st.fg+'">'+esc(q.status||'בבדיקה')+'</span>'+
            '<span class="muted">'+esc(q.kind||'')+'</span></div></div>'+
        '<div style="text-align:end">'+
          '<div class="serif" style="font-size:26px;font-weight:700">'+nis(c.total)+'</div>'+
          '<div class="muted" style="font-size:12px">מנורמל · '+nis(c.perGuest)+' לאורח</div>'+
          (c.estimated ? '<div class="qesttx" style="font-size:11.5px">כולל '+nis(c.estimated)+' בהערכה</div>' : '')+
        '</div></div>'+
      (meta ? '<div class="qmetas">'+meta+'</div>' : '')+
      (c.burnGuests ? '<div class="qburn">על '+c.burnGuests+' אורחים שלא הגיעו נשלם '+nis(c.burnCost)+' לחינם.</div>' : '')+
      (q.notes ? '<div class="muted" style="margin-top:10px;line-height:1.7">'+esc(q.notes)+'</div>' : '')+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line3)">'+
        '<button class="btn sm primary" data-act="q.edit" data-id="'+q.id+'">ערוך</button>'+
        '<button class="btn sm" data-act="q.toggle" data-id="'+q.id+'">'+(open?'הסתר פירוט':'הצג פירוט מלא')+'</button>'+
        '<button class="btn sm" data-act="q.dup" data-id="'+q.id+'">שכפל</button>'+
        '<span style="flex:1"></span>'+
        '<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">'+attachHtml('quote', q.id)+'</div>'+
      '</div>'+
      (open ? '<div style="margin-top:14px">'+lines+
        '<div class="qsumline"><span>מחיר לפי ההצעה</span><b>'+nis(c.quoted)+'</b></div>'+
        (c.sharedCost ? '<div class="qsumline"><span>עלויות קבועות (משותפות)</span><b>+ '+nis(c.sharedCost)+'</b></div>' : '')+
        (c.estimated ? '<div class="qsumline"><span>השלמות בהערכה</span><b class="qesttx">+ '+nis(c.estimated)+'</b></div>' : '')+
        '<div class="qsumline tot"><span>סה״כ מנורמל ב־'+g+' אורחים</span><b>'+nis(c.total)+'</b></div></div>' : '')+
    '</div>';
  }).join('') + '</div>';
}

/* ─────────── 6. בדיקות ─────────── */
function qvTests(){
  var T = runQuoteTests(), bad = T.filter(function(t){ return !t.ok; });
  return '<div class="card" style="overflow:hidden">'+
    '<div class="toolbar"><div style="font-size:15px;font-weight:700;flex:1">בדיקות לנוסחאות החישוב</div>'+

/* ─────────── מודל עריכת הצעה ─────────── */
function qFld(q){
  return function(label, act, val, type){
    return '<label class="qf" style="flex:1"><span>'+label+'</span>'+
      '<input '+(type?'type="'+type+'" ':'')+'data-act="'+act+'" data-id="'+q.id+'" data-k="qe'+q.id+act+'" value="'+esc(val==null?'':val)+'"></label>';
  };
}
function qSelFld(q){
  return function(label, act, val, opts){
    return '<label class="qf" style="flex:1"><span>'+label+'</span>'+
      '<select data-act="'+act+'" data-id="'+q.id+'">'+opts.map(function(o){
        var v = o.push ? o[0] : o, t = o.push ? o[1] : o;
        return '<option value="'+esc(v)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(t)+'</option>';
      }).join('')+'</select></label>';
  };
}

function quoteModal(){
  var q = row('quotes', S.qEdit);
  if (!q) return '';
  var g = qGuests(), c = qCalc(q, g), lines = qLines(q.id);
  var items = qItemList();


  var lineRows = lines.map(function(l){
    return qLineRow(l, c.rows.filter(function(x){ return x.line.id === l.id; })[0], items);
  }).join('') || '<div class="muted" style="padding:10px 0">עוד אין שורות. הוסיפו שורה, או טענו תבנית מוכנה.</div>';

  return qModalHtml(q, c, g, items, lineRows);
}

      '<label class="qf" style="flex:1.1;min-width:132px"><span>קטגוריה</span>'+
        '<input list="qitemlist" data-act="q.l.cat" data-id="'+l.id+'" data-k="'+k+'c" value="'+esc(l.cat)+'"></label>'+
      '<label class="qf" style="flex:1.8;min-width:150px"><span>תיאור</span>'+
        '<input data-act="q.l.desc" data-id="'+l.id+'" data-k="'+k+'d" value="'+esc(l.desc)+'"></label>'+
      '<label class="qf" style="flex:0 0 108px"><span>סוג חישוב</span>'+
        '<select data-act="q.l.calc" data-id="'+l.id+'">'+QCALC.map(function(o){
          return '<option value="'+o[0]+'"'+(l.calc===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select></label>'+

          '<input type="number" data-act="q.l.per" data-id="'+l.id+'" data-k="'+k+'p" value="'+(Math.round(qNum(l.per,0))||'')+'" placeholder="15"></label>' : '')+
      (l.calc === 'percent' ?

          '<select data-act="q.l.pctOf" data-id="'+l.id+'">'+['<option value="">כל השורות</option>'].concat(items.map(function(it){
            return '<option value="'+esc(it)+'"'+(l.pctOf===it?' selected':'')+'>'+esc(it)+'</option>'; })).join('')+'</select></label>' : '')+
      (l.calc === 'included' ? '' :
        '<label class="qck"><input type="checkbox" class="ck" data-act="q.l.vat" data-id="'+l.id+'"'+(l.vatInc?' checked':'')+'> כולל מע״מ</label>'+

/* טעינת שורות מתבנית — לא מכפילה שורות שכבר קיימות */
function addTplLines(quoteId, tplName){
  var t = QTPL[tplName]; if (!t) return;
  var have = {};
  qLines(quoteId).forEach(function(l){ have[(l.cat||'') + '|' + (l.desc||'')] = 1; });
  t.lines.forEach(function(r){
    if (have[r[0] + '|' + r[1]]) return;
    S.quoteLines.push({id:uid(), quoteId:quoteId, cat:r[0], desc:r[1], calc:r[2],
                       amount:0, per:r[3]||0, pctOf:'', vatInc:false, ext:false, note:''});
  });
  var q = row('quotes', quoteId);
  if (q && !qNum(q.minGuests,0) && t.minGuests){ q.minGuests = t.minGuests; q.minMode = t.minMode; }
  touch();
}

/* ─────────────── שיבוץ אוטומטי ─────────────── */
function autoSeat(){
  var load = {}, catOf = {};
  S.tables.forEach(function(t){ load[t.name] = 0; });
  S.guests.forEach(function(g){
    if (g.table && load[g.table] !== undefined){
      load[g.table] += people(g);
      catOf[g.table] = catOf[g.table] || (g.side+'|'+(g.category||'אחר'));
    }
  });
  var pool = S.guests.filter(function(g){ return !g.table && g.rsvp!=='לא מגיע'; });
  var byCat = {};
  pool.forEach(function(g){ var k = g.side+'|'+(g.category||'אחר'); (byCat[k]=byCat[k]||[]).push(g); });
  Object.keys(byCat).forEach(function(k){
    byCat[k].forEach(function(g){
      var p = people(g);
      var t = S.tables.filter(function(t){ return (catOf[t.name]===k || !catOf[t.name]) && (t.seats-(load[t.name]||0))>=p; })[0];
      if (!t) t = S.tables.filter(function(t){ return (t.seats-(load[t.name]||0))>=p; })[0];
      if (t){ g.table = t.name; load[t.name] += p; catOf[t.name] = catOf[t.name] || k; }
    });
  });
  touch();
}

/* ─────────────── קבצים ─────────────── */
function uploadFiles(input){
  var file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  if (!CFG.token){ alert('כדי לשמור קבצים בדרייב צריך קודם להתחבר (כפתור "סנכרון וייבוא").'); return; }
  if (file.size > 15*1024*1024){ alert('הקובץ גדול מדי (מקסימום 15MB). העלה אותו ישירות לתיקייה בדרייב.'); return; }
  var owner = input.dataset.owner, ownerId = input.dataset.id || '';
  setNet('saving','מעלה '+file.name+'…');
  var rd = new FileReader();
  rd.onload = function(){
    var b64 = rd.result.split(',')[1];
    api('upload', {name:file.name, mime:file.type||'application/octet-stream', data:b64, ownerType:owner, ownerId:ownerId})
      .then(function(j){ S.files.push(j.file); S.rev = j.rev; persist(); setNet('ok','הקובץ נשמר בדרייב'); render(); })
      .catch(function(e){ setNet('error','העלאה נכשלה: '+e.message); alert('העלאה נכשלה: '+e.message); });
  };
  rd.readAsDataURL(file);
}
function removeFile(id){
  if (!confirm('למחוק את הקובץ מהדרייב?')) return;
  if (!CFG.token){ S.files = S.files.filter(function(f){ return f.id!==id; }); touch(); render(); return; }
  api('delfile', {id:id}).then(function(j){
    S.files = S.files.filter(function(f){ return f.id!==id; });
    S.rev = j.rev; persist(); render();
  }).catch(function(e){ alert('מחיקה נכשלה: '+e.message); });
}

function exportSheets(base, sheets){
  if (window.XLSX){
    var wb = XLSX.utils.book_new();
    sheets.forEach(function(sh){ XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sh.rows), sh.name); });
    XLSX.writeFile(wb, base+'.xlsx');
    return;
  }
  sheets.forEach(function(sh){
    var rows = sh.rows; if (!rows.length) return;
    var head = Object.keys(rows[0]);
    var q = function(x){ return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'; };
    var csv = [head.map(q).join(',')].concat(rows.map(function(r){ return head.map(function(h){ return q(r[h]); }).join(','); })).join('\n');
    var blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = (sheets.length>1 ? base+' - '+sh.name : base)+'.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 100);
  });
}
function parseCsv(text){
  var lines = text.replace(/\r/g,'').split('\n').filter(function(l){ return l.trim(); });
  if (!lines.length) return [];
  var split = function(l){ var out=[],cur='',q=false;
    for (var i=0;i<l.length;i++){ var ch=l[i];
      if (ch==='"') q=!q; else if (ch===',' && !q){ out.push(cur); cur=''; } else cur+=ch; }
    out.push(cur); return out; };
  var head = split(lines[0]).map(function(h){ return h.trim(); });
  return lines.slice(1).map(function(l){ var c = split(l), o = {};
    head.forEach(function(h,i){ o[h] = (c[i]||'').trim(); }); return o; });
}
function sheetToGuests(rows, sideHint){
  var pick = function(r, keys){
    for (var k in r){ var kk = String(k).trim();
      for (var i=0;i<keys.length;i++){ if (kk.indexOf(keys[i])===0 || kk===keys[i]) return r[k]; } }
    return '';
  };
  var out = [];
  rows.forEach(function(r){
    var first = String(pick(r,['שם פרטי','שם'])).trim();
    var last  = String(pick(r,['שם משפחה'])).trim();
    var full  = String(pick(r,['שם מלא'])).trim() || (first+' '+last).trim();
    if (!full) return;
    var side = String(pick(r,['צד'])).trim();
    if (sideHint && sideHint!=='auto') side = sideHint;
    if (side!==SIDE_A && side!==SIDE_B) side = SIDE_A;
    var arr = String(pick(r,['הגיעו','הגיע'])).trim();
    out.push({ id:uid(), name:full, side:side,
      category:String(pick(r,['קטגוריה'])).trim()||'אחר',
      phone:fixPhone(pick(r,['מספר טלפון','טלפון'])),
      adults:+pick(r,['כמות','מבוגרים'])||1, kids:+pick(r,['ילדים'])||0,
      rsvp:String(pick(r,['אישור'])).trim()||'טרם',
      chance:(function(c){ return CHANCE_PCT[c]!==undefined ? c : ''; })(String(pick(r,['סבירות'])).trim()),
      arrived:(arr==='V'||arr==='v'||arr==='כן'),
      gift:+pick(r,['מתנה'])||0, table:String(pick(r,['שולחן'])).trim(),
      notes:String(pick(r,['הערות'])).trim() });
  });
  return out;
}
function mergeGuests(incoming){
  var key = function(g){ return String(g.name||'').replace(/\s+/g,'')+'|'+String(g.phone||'').replace(/\D/g,''); };
  var map = {}, order = [];
  S.guests.forEach(function(g){ var k = key(g); if(!(k in map)) order.push(k); map[k] = g; });
  var added = 0, updated = 0;
  incoming.forEach(function(n){
    var k = key(n);
    if (map[k]){ var ex = map[k]; Object.assign(ex, n, {id:ex.id, table:ex.table||n.table}); updated++; }
    else { map[k] = n; order.push(k); added++; }
  });
  S.guests = order.map(function(k){ return map[k]; });
  S.importMsg = 'יובאו '+added+' חדשים, עודכנו '+updated+'.';
  touch();
}
function importFile(input){
  var file = input.files && input.files[0]; input.value = '';
  if (!file) return;
  var rd = new FileReader();
  rd.onload = function(ev){
    try{
      var rows;
      if (/\.csv$/i.test(file.name) || !window.XLSX){
        if (!/\.csv$/i.test(file.name) && !window.XLSX){
          S.importMsg = 'קריאת xlsx לא זמינה (אין חיבור לרשת). שמור את הקובץ כ-CSV.'; render(); return;
        }
        rows = parseCsv(new TextDecoder('utf-8').decode(new Uint8Array(ev.target.result)));
      } else {
        var wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        rows = [];
        wb.SheetNames.forEach(function(nm){
          var r = XLSX.utils.sheet_to_json(wb.Sheets[nm], {defval:''});
          var hint = nm.indexOf(SIDE_A)>=0 ? SIDE_A : (nm.indexOf(SIDE_B)>=0 ? SIDE_B : null);
          r.forEach(function(x){ if (hint && !x['צד']) x['צד'] = hint; rows.push(x); });
        });
      }
      mergeGuests(sheetToGuests(rows, S.importSide||'auto'));
      render();
    }catch(err){ S.importMsg = 'שגיאה בקריאת הקובץ: '+err.message; render(); }
  };
  rd.readAsArrayBuffer(file);
}

/* ═══════════════════ אירועים ═══════════════════ */
function dispatch(el, evtName){
  var act = el.dataset.act;
  var fn = ACT[act];
  if (!fn) return false;
  var needsRender = fn(el, evtName);
  if (needsRender) reflow(act);
  return !!needsRender;
}

/* עריכה בתוך מודל ההצעה נוגעת רק במודל. ציור מחדש של כל הדף בכל הקלדה
   או בחירה בתפריט גרם להבהוב — הכותרת, הלשוניות והטבלה נבנו מחדש לחינם. */
var QLOCAL = {};
('q.name q.kind q.status q.contact q.quoteDate q.validUntil q.eventDate q.weekday q.notes ' +
 'q.payTerms q.minGuests q.minMode q.penaltyPer q.penaltyVat q.deposit q.paid q.tpl q.more ' +
 'q.l.add q.l.del q.l.cat q.l.desc q.l.calc q.l.note q.l.noteOpen q.l.pctOf q.l.amount ' +
 'q.l.per q.l.vat q.l.ext').split(' ').forEach(function(a){ QLOCAL[a] = 1; });

function reflow(act){
  if (S.qEdit && QLOCAL[act] && renderModalOnly()) return;
  if (!S.qEdit && S.view === 'quotes' && act && (act.indexOf('q.l.') === 0 || act.indexOf('q.f.') === 0)
      && renderViewOnly()) return;
  render();
}
function renderModalOnly(){
  var old = document.getElementById('qmodal');
  if (!old) return false;
  var box = old.querySelector('.modal'), top = box ? box.scrollTop : 0;
  var foc = grabFocus();
  var tmp = document.createElement('div');
  tmp.innerHTML = quoteModal();
  if (!tmp.firstChild) return false;
  old.parentNode.replaceChild(tmp.firstChild, old);
  var nb = document.querySelector('#qmodal .modal'); if (nb && top) nb.scrollTop = top;
  putFocus(foc);
  return true;
}

/* עריכה בתוך גוף התצוגה (למשל מסך העלויות הקבועות) — הכותרת, הלשוניות
   ומחוון הסנכרון נשארים על מקומם ולא מהבהבים. */
function renderViewOnly(){
  var host = document.getElementById('viewbody');
  if (!host) return false;
  var foc = grabFocus();
  var tbl = host.querySelector('.tblscroll'), left = tbl ? tbl.scrollLeft : 0;
  host.innerHTML = viewHtml();
  var nt = host.querySelector('.tblscroll'); if (nt && left) nt.scrollLeft = left;
  putFocus(foc);
  return true;
}
var app = document.getElementById('app');
app.addEventListener('click', function(e){
  // לחיצה מחוץ לתפריט הקטגוריות סוגרת אותו
  var closing = S.fCatOpen && !e.target.closest('.multi');
  if (closing) S.fCatOpen = false;
  var el = e.target.closest('[data-act]');
  if (!el){ if (closing) render(); return; }
  if (el.tagName==='INPUT' || el.tagName==='SELECT' || el.tagName==='TEXTAREA' || el.tagName==='A') return;
  // לחיצה בתוך החלון לא סוגרת אותו — רק לחיצה על הרקע עצמו
  if (el.classList.contains('backdrop') && e.target !== el) return;
  e.preventDefault();
  if (!dispatch(el, 'click') && closing) render();
});
// הקלדה: מעדכנים מצב בלי לצייר מחדש (חוץ מחיפוש/סינון) כדי לא לקטוע הקלדה.
app.addEventListener('input', function(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  if (el.type==='checkbox' || el.type==='file' || el.tagName==='SELECT' || el.type==='date') return;
  dispatch(el, 'input');
});
// סיום עריכה / בחירה / סימון: מעדכנים ומציירים מחדש (כל המדדים מתעדכנים).
app.addEventListener('change', function(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  var fn = ACT[el.dataset.act]; if (!fn) return;
  fn(el, 'change');
  if (el.type !== 'file') reflow(el.dataset.act);
});
app.addEventListener('keydown', function(e){
  if (e.key==='Escape' && S.fCatOpen){ S.fCatOpen = false; render(); return; }
  if (e.key==='Escape' && S.qEdit){ S.qEdit = null; render(); return; }
  if (e.key!=='Enter') return;
  if (e.target.id==='gatepw'){ e.preventDefault(); tryLogin(); return; }
  if (e.target.dataset && e.target.dataset.act==='newTask'){ e.preventDefault(); dispatch(e.target,'input'); ACT['task.add'](); render(); }
});

/* גרירה: שם מהבנק → שולחן, והזזת שולחנות בקנבס */
var dragGuest = null;
app.addEventListener('dragstart', function(e){
  var chip = e.target.closest('[data-drag]');
  if (!chip) return;
  dragGuest = chip.dataset.drag;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', dragGuest); }catch(err){}
});
app.addEventListener('dragover', function(e){
  if (e.target.closest('#canvas')) e.preventDefault();
});
app.addEventListener('drop', function(e){
  var node = e.target.closest('.tnode'); if (!node) return;
  e.preventDefault();
  var t = row('tables', node.dataset.table);
  if (t && dragGuest){ upd('guests', dragGuest, {table:t.name}); dragGuest = null; render(); }
});
app.addEventListener('pointerdown', function(e){
  var node = e.target.closest('.tnode'); if (!node || e.button!==0) return;
  var t = row('tables', node.dataset.table); if (!t) return;
  var startX = e.clientX, startY = e.clientY, ox = t.x, oy = t.y, moved = false;
  var move = function(ev){
    var dx = ev.clientX-startX, dy = ev.clientY-startY;
    if (!moved && Math.abs(dx)+Math.abs(dy) < 4) return;
    moved = true;
    var snap = function(n){ return Math.max(PAD, Math.round(n/13)*13); };
    t.x = snap(ox+dx); t.y = snap(oy+dy);
    node.style.left = (t.x-PAD)+'px'; node.style.top = (t.y-PAD)+'px';
  };
  var up = function(){
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    if (moved){ touch(); }
    else { S.selectedTable = t.id; render(); }
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
});

/* ═══════════════════ הפעלה ═══════════════════ */
// מכשיר מוכר → מציירים מיד מהמטמון המקומי ומרעננים ברקע.
// מכשיר חדש → מסך כניסה, והנתונים מגיעים מהגיליון אחרי שהסיסמה אושרה.
render();
if (authed) pull().catch(function(){ /* אין רשת — עובדים מהעותק המקומי */ });
</script>
