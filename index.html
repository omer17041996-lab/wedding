<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3E5D50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="החתונה">
<title>עומר & נועה · לוח ניהול החתונה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#23201C; --bg:#F5F2ED; --card:#FFFFFF; --line:#E4DED4; --line2:#EFEBE4;
    --line3:#F4F0EA; --muted:#8C857B; --faint:#B5AEA4; --green:#3E5D50; --clay:#B4714E;
    --soft:#FBF9F6; --gold:#9A7B33;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{font-family:'Assistant','Heebo','Arial Hebrew','Noto Sans Hebrew',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--green);text-decoration:none}
  a:hover{color:var(--clay);text-decoration:underline}
  input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:-1px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#DAD3C8;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}

  .wrap{max-width:1560px;margin:0 auto;padding:0 28px}
  .serif{font-family:'Frank Ruhl Libre',serif}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px}
  .muted{color:var(--muted);font-size:13px}

  header.top{position:sticky;top:0;z-index:40;background:rgba(245,242,237,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between;padding:18px 0 0}
  .brand{font-family:'Frank Ruhl Libre',serif;font-size:30px;font-weight:700;letter-spacing:-.5px}
  .brand span{color:var(--clay);font-size:22px}
  .chip{display:flex;align-items:center;gap:8px;background:#FFF;border:1px solid var(--line);border-radius:10px;padding:7px 12px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0}
  .tab{border:1px solid var(--line);background:#FFF;color:#5B554D;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  .tab:hover{border-color:var(--green);color:var(--green)}
  .tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  .btn{background:#FFF;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--green);color:var(--green)}
  .btn.primary{background:var(--green);color:#FFF;border-color:var(--green)}
  .btn.primary:hover{background:#33503F;color:#FFF}
  .btn.danger{background:#FDF6F2;border-color:#EADFD8;color:var(--clay)}
  .btn.sm{padding:7px 12px;font-size:12.5px}
  .x{border:none;background:transparent;color:#C0B8AC;cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
  .x:hover{color:var(--clay)}

  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .cards3{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
  .kpi{padding:18px 20px}
  .kpi .lbl{font-size:13px;color:var(--muted);margin-bottom:6px}
  .kpi .val{font-family:'Frank Ruhl Libre',serif;font-size:34px;font-weight:700;line-height:1}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:6px}
  .bar{height:6px;background:#EFEBE4;border-radius:4px;margin-top:10px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--green);border-radius:4px}

  table.t{width:100%;border-collapse:collapse}
  table.t th{padding:11px 12px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line2);background:var(--soft);text-align:right;white-space:nowrap}
  table.t td{padding:6px 10px;border-bottom:1px solid var(--line3)}
  table.t tr:hover td{background:#FCFBF9}
  .cell{border:1px solid transparent;border-radius:7px;padding:6px 8px;font-size:13px;background:transparent;width:100%}
  .cell:hover{border-color:var(--line2)}
  .cell.b{font-weight:600;font-size:14px}
  .num{border:1px solid var(--line2);border-radius:7px;padding:6px;font-size:13px;text-align:center;width:56px}
  .sel{border:1px solid var(--line2);border-radius:7px;padding:5px 7px;font-size:13px;font-weight:600;background:#FFF}
  .pill{font-size:12px;padding:3px 9px;border-radius:999px;display:inline-block;white-space:nowrap}
  .ck{width:17px;height:17px;accent-color:var(--green);cursor:pointer}
  .field{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;background:#FFF}

  .multi{position:relative}
  .multi .mbtn{display:flex;align-items:center;gap:8px;min-width:158px;cursor:pointer;user-select:none;text-align:right}
  .multi .mbtn.on{border-color:var(--green);color:var(--green)}
  .multi .mbtn>span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .multi .cnt{background:var(--green);color:#FFF;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
  .multi .arw{font-size:10px;color:var(--muted)}
  .drop{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:70;background:#FFF;border:1px solid var(--line);
        border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.13);padding:8px;min-width:212px;max-height:290px;overflow:auto}
  .drop .dhead{display:flex;gap:8px;padding:2px 4px 8px;margin-bottom:6px;border-bottom:1px solid var(--line2)}
  .drop .dhead button{flex:1;background:var(--soft);border:1px solid var(--line2);border-radius:8px;padding:5px;font-size:12px;font-weight:600;cursor:pointer}
  .drop .dhead button:hover{border-color:var(--green);color:var(--green)}
  .drop label{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;font-size:13.5px;cursor:pointer}
  .drop label:hover{background:var(--soft)}
  .drop .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .drop .dn{color:var(--muted);font-size:11.5px;margin-inline-start:auto}

  .toolbar{padding:16px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line2)}
  .foot{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-top:1px solid var(--line2);gap:10px;flex-wrap:wrap;border-radius:0 0 15px 15px}

  /* seating */
  .seatgrid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
  .canvas{position:relative;background:#FFF;border:1px solid var(--line);border-radius:16px;height:660px;overflow:auto;
          background-image:radial-gradient(#EDE8E0 1px,transparent 1px);background-size:26px 26px}
  .tnode{position:absolute;cursor:grab;user-select:none;touch-action:none}
  .ttop{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;overflow:hidden;
        box-shadow:0 6px 18px rgba(35,32,28,.09),inset 0 0 0 1px rgba(255,255,255,.7);border:2px solid var(--line);background:#FFF}
  .chair{position:absolute;border:1px solid var(--line)}
  .pop{position:absolute;top:100%;right:0;margin-top:8px;width:236px;background:#FFF;border:1px solid var(--line);border-radius:14px;
       box-shadow:0 16px 40px rgba(35,32,28,.16);padding:12px 14px;z-index:60;pointer-events:none;animation:fadeUp .12s ease}
  .bankchip{cursor:grab;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--soft)}
  .attach{display:inline-flex;align-items:center;gap:5px;background:#F7F4EE;border:1px solid var(--line2);border-radius:8px;padding:3px 6px 3px 4px;font-size:12px}
  .attach .tag{font-size:9px;font-weight:700;letter-spacing:.4px;color:var(--clay);border:1px solid #EADFD8;border-radius:4px;padding:1px 3px}
  .adder{cursor:pointer;border:1px dashed #D8D0C4;border-radius:8px;padding:4px 9px;font-size:12px;color:var(--muted);white-space:nowrap}
  .adder:hover{border-color:var(--green);color:var(--green)}

  /* modal */
  .backdrop{position:fixed;inset:0;background:rgba(35,32,28,.42);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
  .modal{background:#FFF;border-radius:18px;width:600px;max-width:100%;max-height:88vh;overflow-y:auto;padding:26px 28px;animation:fadeUp .18s ease}
  .box{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
  .box h4{margin:0 0 4px;font-size:14px}
  .box p{margin:0 0 12px;font-size:12px;color:var(--muted);line-height:1.6}

  /* מסך כניסה */
  .gate{position:fixed;inset:0;background:#3E5D50;display:flex;align-items:center;justify-content:center;padding:24px}
  .gatecard{width:390px;max-width:100%;text-align:center;animation:fadeUp .3s ease}
  .gatecard .ring{width:96px;height:96px;margin:0 auto 22px;border:4px solid rgba(245,242,237,.5);border-radius:50%;
                  display:flex;align-items:center;justify-content:center;background:#F5F2ED}
  .gatecard .ring b{font-family:'Frank Ruhl Libre',serif;font-size:26px;color:#3E5D50}
  .gatecard h1{font-family:'Frank Ruhl Libre',serif;font-size:30px;font-weight:700;color:#F5F2ED;margin:0 0 4px}
  .gatecard h1 em{color:#D9A184;font-style:normal;font-size:22px}
  .gatecard .sub{color:rgba(245,242,237,.62);font-size:14px;margin-bottom:28px}
  .gatecard input{width:100%;border:1px solid rgba(245,242,237,.3);background:rgba(255,255,255,.08);color:#F5F2ED;
                  border-radius:12px;padding:14px 16px;font-size:16px;text-align:center;letter-spacing:2px}
  .gatecard input::placeholder{color:rgba(245,242,237,.45);letter-spacing:0}
  .gatecard input:focus{outline:2px solid #D9A184;outline-offset:0}
  .gatecard button{width:100%;margin-top:12px;border:none;border-radius:12px;padding:14px;font-size:15px;
                   font-weight:700;background:#F5F2ED;color:#3E5D50;cursor:pointer}
  .gatecard button:disabled{opacity:.55;cursor:default}
  .gatecard .err{color:#F0B9A0;font-size:13px;min-height:20px;margin-top:12px}
  .gatecard .hint{color:rgba(245,242,237,.45);font-size:12px;margin-top:6px;line-height:1.7}

  /* status */
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
  .banner{background:#FBF3E6;border:1px solid #E9DCC0;color:#7A5F1E;border-radius:12px;padding:11px 16px;margin:14px 0 0;
          display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
  .spin{width:11px;height:11px;border:2px solid #D8D0C4;border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}

  @media(max-width:900px){
    .wrap{padding:0 14px}
    .seatgrid{grid-template-columns:1fr}
    .brand{font-size:24px}
    .modal{padding:20px 18px}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════
   לוח ניהול החתונה — עומר & נועה
   הנתונים חיים בגיליון גוגל בתוך תיקיית הדרייב, דרך Apps Script Web App.
   ללא חיבור — עובד מקומית מול הדפדפן (localStorage) ומסתנכרן כשמתחברים.
   ══════════════════════════════════════════════════════════════════ */

var SIDE_A = 'עומר', SIDE_B = 'נועה';
var CAT_COLORS = {'משפחה':'#3E5D50','משפחה מורחבת':'#5A7A6A','חברים':'#B4714E','עבודה':'#6B7A8F','צבא':'#7D6B8F','ילדות':'#A08A4B','שכונה':'#8C7A6B','אחר':'#9A938A'};
var SHAPES = {'עגול':'round','מרובע':'square','מלבני':'rect','ארוך':'long'};
var SHAPE_HE = {round:'עגול',square:'מרובע',rect:'מלבני',long:'ארוך'};
var LS_DATA = 'wedding-data-v2', LS_CFG = 'wedding-cfg-v2';

/* כתובת ה-Web app של Apps Script — מוטמעת בקובץ, המשתמש לא נוגע בה.
   ההגנה היא הסיסמה, שנשמרת רק במכשיר של המשתמש ולא נמצאת בקוד. */
var API_URL = 'https://script.google.com/macros/s/AKfycbwlO5dX_T-c---p98yMzQCK-xRzAMUCmud9SLNbpOpkuTwaE-Fjzxwv7qu5U71aEW_I/exec';

var uid = function(){ return Math.random().toString(36).slice(2,9); };
var nis = function(n){ return '₪' + Math.round(n||0).toLocaleString('he-IL'); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
var catColor = function(c){ return CAT_COLORS[c] || CAT_COLORS['אחר']; };
var people = function(g){ return (+g.adults||0) + (+g.kids||0); };
var DEFAULT_SETTINGS = {'תאריך החתונה':'2026-12-17', 'תקציב מתוכנן':160000};

/* סבירות הגעה — שלוש רמות, וכל אחת שווה אחוז לצורך חישוב הצפי */
var CHANCE_LEVELS = ['גבוהה','בינונית','נמוכה'];
var CHANCE_PCT    = {'גבוהה':90, 'בינונית':60, 'נמוכה':25};
var CHANCE_STYLE  = {'גבוהה':{bg:'#EEF2EF',fg:'#3E5D50'}, 'בינונית':{bg:'#F1EDE4',fg:'#9A7B33'}, 'נמוכה':{bg:'#FBF3E6',fg:'#B4714E'}};
var CHANCE_COLOR  = {'גבוהה':'#3E5D50', 'בינונית':'#9A7B33', 'נמוכה':'#B4714E'};
// לא נבחרה רמה → נגזרת מאישור ההגעה, ומשתנה איתו עד שבוחרים ידנית
function levelOf(g){
  if (CHANCE_PCT[g.chance] !== undefined) return g.chance;
  return g.rsvp==='אישר' ? 'גבוהה' : g.rsvp==='לא מגיע' ? 'נמוכה' : 'בינונית';
}
function chanceOf(g){ return g.rsvp==='לא מגיע' ? 0 : CHANCE_PCT[levelOf(g)]; }

/* טבעת דונאט מ-SVG: מחשב dash/offset לכל פלח */
function donut(items, size, thickness){
  var total = items.reduce(function(a,x){ return a+x.value; },0) || 1;
  var r = (size-thickness)/2, C = 2*Math.PI*r, acc = 0;
  return {
    size:size, half:size/2, r:r, thickness:thickness, total:total,
    segments: items.filter(function(x){ return x.value>0; }).map(function(x){
      var frac = x.value/total;
      var s = {color:x.color, dash:(frac*C)+' '+C, offset:(-acc*C)};
      acc += frac; return s;
    }),
    legend: items.map(function(x){
      return {label:x.label, color:x.color, value:x.value, pct:Math.round(x.value/total*100)+'%'};
    })
  };
}
function donutHtml(d, centerTop, centerSub, centerColor, showPct){
  return '<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">'+
    '<div style="position:relative;flex:none;width:'+d.size+'px;height:'+d.size+'px">'+
      '<svg width="'+d.size+'" height="'+d.size+'" viewBox="0 0 '+d.size+' '+d.size+'" style="transform:rotate(-90deg)">'+
        '<circle cx="'+d.half+'" cy="'+d.half+'" r="'+d.r+'" fill="none" stroke="#F4F0EA" stroke-width="'+d.thickness+'"></circle>'+
        d.segments.map(function(s){
          return '<circle cx="'+d.half+'" cy="'+d.half+'" r="'+d.r+'" fill="none" stroke-width="'+d.thickness+
                 '" stroke="'+s.color+'" stroke-dasharray="'+s.dash+'" stroke-dashoffset="'+s.offset+'"></circle>';
        }).join('')+
      '</svg>'+
      '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">'+
        '<span class="serif" style="font-size:30px;font-weight:700;line-height:1'+(centerColor?';color:'+centerColor:'')+'">'+centerTop+'</span>'+
        '<span style="font-size:12px;color:var(--muted)">'+esc(centerSub)+'</span>'+
      '</div></div>'+
    '<div style="display:flex;flex-direction:column;gap:10px;flex:1;min-width:150px">'+
      d.legend.map(function(l){
        return '<div style="display:flex;align-items:center;gap:9px">'+
          '<span style="width:10px;height:10px;border-radius:3px;flex:none;background:'+l.color+'"></span>'+
          '<span style="font-size:13px;flex:1">'+esc(l.label)+'</span>'+
          '<span style="font-size:13px;font-weight:700">'+l.value+'</span>'+
          (showPct===false ? '' : '<span style="font-size:12px;color:var(--muted);width:38px;text-align:left">'+l.pct+'</span>')+
        '</div>';
      }).join('')+
    '</div></div>';
}

// טלפונים: גוגל שיטס בולעת את ה-0 המוביל ("0527283843" נשמר כמספר 527283843).
// מחזירים את האפס ומאחדים לפורמט אחיד — נייד 052-7283843, קווי 03-6721145.
function fixPhone(p){
  p = String(p==null?'':p).trim();
  if (!p) return '';
  if (/[^\d\-\s()]/.test(p)) return p;            // +972, שלוחה, טקסט חופשי — משאירים כמו שהוא
  var d = p.replace(/\D/g, '');
  if (d.length === 9 && d.charAt(0) !== '0') d = '0' + d;   // 527283843 → 0527283843
  if (d.length === 8 && d.charAt(0) !== '0') d = '0' + d;   // 36721145  → 036721145
  if (d.length === 10 && d.charAt(0) === '0') return d.slice(0,3) + '-' + d.slice(3);
  if (d.length === 9  && d.charAt(0) === '0') return d.slice(0,2) + '-' + d.slice(2);
  return p;                                       // מוקד 1-700, קיצור *2020 וכו׳
}

/* ─────────────── מצב ─────────────── */
var CFG = load(LS_CFG, {token:'', auto:true});
var authed = !!CFG.token;          // האם המכשיר הזה כבר עבר סיסמה
var gateMsg = '', gateBusy = false;
var S = {
  view:'overview', search:'', fSide:'all', fCats:[], fCatOpen:false, fRsvp:'all', limit:50,
  bankSearch:'', newShape:'round', newSeats:'12', selectedTable:null,
  newTask:'', newTaskCat:'כללי', newTaskDue:'',
  syncOpen:false, importMsg:'', syncMsg:'', conflict:false,
  net:'off', /* off | ok | saving | error */ netMsg:'',
  guests:[], vendors:[], venues:[], tasks:[], tables:[], files:[],
  settings:Object.assign({}, DEFAULT_SETTINGS), rev:0
};
var cached = load(LS_DATA, null);
if (cached) Object.assign(S, cached);
if (!Array.isArray(S.fCats)) S.fCats = [];

function load(k, dflt){ try{ var r = localStorage.getItem(k); return r ? JSON.parse(r) : dflt; }catch(e){ return dflt; } }
function persist(){
  try{
    localStorage.setItem(LS_DATA, JSON.stringify({
      guests:S.guests, vendors:S.vendors, venues:S.venues, tasks:S.tasks,
      tables:S.tables, files:S.files, settings:S.settings, rev:S.rev
    }));
    localStorage.setItem(LS_CFG, JSON.stringify(CFG));
  }catch(e){}
}
function snapshot(){
  return {guests:S.guests, vendors:S.vendors, venues:S.venues, tasks:S.tasks, tables:S.tables, files:S.files, settings:S.settings};
}

/* ─────────────── שרת ─────────────── */
function api(action, extra){
  if (!CFG.token) return Promise.reject(new Error('לא מחובר'));
  var body = Object.assign({action:action, token:CFG.token}, extra||{});
  return fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // מונע preflight — Apps Script לא תומך ב-OPTIONS
    body:JSON.stringify(body),
    redirect:'follow'
  }).then(function(r){ return r.json(); }).then(function(j){
    if (!j.ok && !j.conflict) throw new Error(j.error || 'שגיאה מהשרת');
    return j;
  });
}

var saveTimer = null, pending = false, inFlight = false, queued = false, saveSeq = 0;
function touch(){                       // נקרא אחרי כל שינוי מקומי
  persist();
  if (!CFG.token || !CFG.auto) return;
  pending = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ pushNow(); }, 1500);
}
function pushNow(force){
  if (!CFG.token) return Promise.resolve();
  clearTimeout(saveTimer);
  // אף פעם לא שולחים שתי שמירות במקביל. אחרת השנייה יוצאת עם מספר גרסה ישן
  // (הראשונה עוד לא חזרה עם החדש) והשרת חושב בטעות שמישהו ערך את הגיליון מבחוץ.
  if (inFlight){ queued = true; return Promise.resolve(); }
  inFlight = true;
  setNet('saving','שומר…');
  return api('save', {data:snapshot(), rev:S.rev, force:!!force}).then(function(j){
    if (j.conflict){
      pending = true; S.conflict = true; setNet('error','הגיליון עודכן מבחוץ');
      render(); return;
    }
    S.rev = j.rev; saveSeq++; pending = false; S.conflict = false;
    persist(); setNet('ok','נשמר ' + new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}));
  }).catch(function(e){
    setNet('error', e.message);
  }).then(function(){
    inFlight = false;
    if (queued){ queued = false; if (!S.conflict) pushNow(); }   // שינויים שנצברו בזמן השמירה
  });
}
function pull(){
  if (!CFG.token) return Promise.reject(new Error('לא מחובר'));
  setNet('saving','טוען…');
  return api('load').then(function(j){
    var d = j.data;
    S.guests  = (d.guests||[]).map(function(g){ g.arrived=!!g.arrived; g.phone=fixPhone(g.phone); return g; });
    S.vendors = (d.vendors||[]).map(function(x){ x.contact = fixPhone(x.contact); return x; });
    S.venues = d.venues||[]; S.files = d.files||[];
    S.tasks   = (d.tasks||[]).map(function(t){ t.done=!!t.done; return t; });
    S.tables  = (d.tables||[]).map(function(t){ t.shape = SHAPES[t.shape] || t.shape || 'round'; return t; });
    // מיזוג ולא החלפה: אם חסרה שורה בלשונית "הגדרות" נשארת ברירת המחדל,
    // והיא נכתבת חזרה לגיליון בשמירה הבאה.
    S.settings = Object.assign({}, DEFAULT_SETTINGS, S.settings, d.settings||{});
    S.rev = d.rev||0;
    S.folderUrl = d.folderUrl||''; S.sheetUrl = d.sheetUrl||'';
    S.conflict = false; pending = false;
    persist(); setNet('ok','סונכרן ' + new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}));
    render();
  }).catch(function(e){ setNet('error', e.message); throw e; });
}
function setNet(state, msg){ S.net = state; S.netMsg = msg||''; paintStatus(); }

/* בדיקה תקופתית — אם מישהו ערך את הגיליון, מציעים לרענן */
setInterval(function(){
  if (!CFG.token || document.hidden || pending || inFlight || S.conflict) return;
  var seq = saveSeq;                                   // אם שמירה שלנו הסתיימה בינתיים,
  api('rev').then(function(j){                         // המספר שקיבלנו כבר לא רלוונטי
    if (seq !== saveSeq || pending || inFlight) return;
    if (j.rev !== S.rev){ S.conflict = true; render(); }
  }).catch(function(){});
}, 30000);

window.addEventListener('beforeunload', function(e){
  if (pending && CFG.token){ e.preventDefault(); e.returnValue = ''; }
});

/* ─────────────── עזרי נתונים ─────────────── */
function row(coll, id){ return S[coll].filter(function(r){ return r.id===id; })[0]; }
function upd(coll, id, patch){ var r = row(coll,id); if(!r) return; Object.assign(r, patch); touch(); }
function del(coll, id){ S[coll] = S[coll].filter(function(r){ return r.id!==id; }); touch(); }
function setting(k){ return S.settings[k]; }
function setSetting(k,v){ S.settings[k]=v; touch(); }
function tableByName(n){ return S.tables.filter(function(t){ return t.name===n; })[0]; }
function filesFor(type,id){ return (S.files||[]).filter(function(f){ return f.ownerType===type && String(f.ownerId)===String(id); }); }

function dueMeta(due, done){
  if (done) return {label:'בוצע', bg:'#EEF2EF', fg:'#3E5D50'};
  if (!due)  return {label:'ללא תאריך', bg:'#F4F0EA', fg:'#8C857B'};
  var d = new Date(due), days = Math.ceil((d - new Date())/86400000);
  if (isNaN(days)) return {label:String(due), bg:'#F4F0EA', fg:'#8C857B'};
  if (days < 0)  return {label:'באיחור', bg:'#FBEDE6', fg:'#B4714E'};
  if (days <= 14) return {label:'בעוד '+days+' ימים', bg:'#FBF3E6', fg:'#9A7B33'};
  return {label:d.toLocaleDateString('he-IL',{day:'numeric',month:'short'}), bg:'#F4F0EA', fg:'#8C857B'};
}
function stats(){
  var g = S.guests;
  var totalPeople = g.reduce(function(a,x){ return a+people(x); },0);
  var confirmedPeople = g.filter(function(x){ return x.rsvp==='אישר'; }).reduce(function(a,x){ return a+people(x); },0);
  var arrivedPeople = g.filter(function(x){ return x.arrived; }).reduce(function(a,x){ return a+people(x); },0);
  var gifts = g.reduce(function(a,x){ return a+(+x.gift||0); },0);
  var vendorTotal = S.vendors.reduce(function(a,x){ return a+(+x.total||0); },0);
  var vendorPaid = S.vendors.reduce(function(a,x){ return a + (x.status==='שולם' ? (+x.total||0) : (+x.advance||0)); },0);
  var expected = Math.round(g.reduce(function(a,x){ return a + people(x)*chanceOf(x)/100; },0));
  return {totalPeople:totalPeople, confirmedPeople:confirmedPeople, arrivedPeople:arrivedPeople,
          gifts:gifts, vendorTotal:vendorTotal, vendorPaid:vendorPaid, expected:expected,
          kids:g.reduce(function(a,x){ return a+(+x.kids||0); },0)};
}

/* ═══════════════════ תצוגה ═══════════════════ */
var VIEWS = [['overview','סקירה'],['guests','מוזמנים'],['seating','סידור שולחנות'],['vendors','ספקים'],
             ['venues','מקומות'],['tasks','משימות'],['budget','תקציב'],['gifts','מתנות']];

/* ─────────────── מסך כניסה ─────────────── */
function renderGate(){
  document.getElementById('app').innerHTML =
    '<div class="gate"><div class="gatecard">' +
      '<div class="ring"><b>ע &amp; נ</b></div>' +
      '<h1>עומר <em>&amp;</em> נועה</h1>' +
      '<div class="sub">לוח ניהול החתונה</div>' +
      '<input type="password" id="gatepw" inputmode="text" autocomplete="current-password" ' +
        'placeholder="הזינו סיסמה"' + (gateBusy ? ' disabled' : '') + '>' +
      '<button data-act="gate.enter"' + (gateBusy ? ' disabled' : '') + '>' +
        (gateBusy ? 'בודק…' : 'כניסה') + '</button>' +
      '<div class="err">' + esc(gateMsg) + '</div>' +
      '<div class="hint">הסיסמה נשמרת במכשיר הזה בלבד.<br>בפעם הבאה שתיכנסו — לא תתבקשו שוב.</div>' +
    '</div></div>';
  var pw = document.getElementById('gatepw');
  if (pw && !gateBusy) pw.focus();
}
function tryLogin(){
  var box = document.getElementById('gatepw');
  var pw = box ? box.value.trim() : '';
  if (!pw){ gateMsg = 'צריך להזין סיסמה'; renderGate(); return; }
  gateMsg = ''; gateBusy = true; renderGate();
  CFG.token = pw; authed = true;
  pull().then(function(){
    persist();                       // הסיסמה נשמרת רק אחרי שהשרת אישר אותה
  }).catch(function(e){
    CFG.token = ''; authed = false; gateBusy = false;
    gateMsg = /סיסמה/.test(e.message) ? 'סיסמה שגויה. נסו שוב.'
            : 'אין חיבור לשרת — בדקו אינטרנט ונסו שוב. (' + e.message + ')';
    renderGate();
  });
}
function logout(){
  if (!confirm('לצאת מהמכשיר הזה? הנתונים נשארים בגיליון, ובכניסה הבאה תתבקש סיסמה.')) return;
  pushNow().then(function(){
    try{ localStorage.removeItem(LS_DATA); localStorage.removeItem(LS_CFG); }catch(e){}
    location.reload();
  });
}

  if (!authed) return renderGate();
  var act = document.activeElement;
  var fk = act && act.dataset ? act.dataset.k : null;
  var selS = null, selE = null;
  try{ selS = act.selectionStart; selE = act.selectionEnd; }catch(e){}

  var wd = setting('תאריך החתונה') || '';
  var days = Math.ceil((new Date(wd) - new Date())/86400000);
  var daysLabel = isNaN(days) ? '—' : (days>=0 ? 'עוד '+days+' ימים' : 'התחתנו!');

  document.getElementById('app').innerHTML =
    '<header class="top"><div class="wrap">' +
      '<div class="topbar">' +
        '<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">' +
          '<div class="brand">עומר <span>&amp;</span> נועה</div>' +
          '<div class="muted">לוח ניהול החתונה</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
          '<div class="chip"><span style="font-size:12px;color:var(--muted)">תאריך</span>' +
            '<input type="date" data-act="wdate" data-k="wdate" value="'+esc(wd)+'" style="border:none;background:transparent;font-size:14px;font-weight:600;padding:0">' +
            '<span style="width:1px;height:18px;background:var(--line)"></span>' +
            '<span style="font-size:13px;font-weight:700;color:var(--green)">'+daysLabel+'</span></div>' +
          '<div id="netbox" class="status"></div>' +
          '<button class="btn" data-act="open-sync">סנכרון וייבוא</button>' +
        '</div>' +
      '</div>' +
      '<div class="tabs">' + VIEWS.map(function(v){
          return '<button class="tab'+(S.view===v[0]?' on':'')+'" data-act="nav" data-v="'+v[0]+'">'+v[1]+'</button>';
        }).join('') + '</div>' +
    '</div></header>' +
    '<div class="wrap" style="padding-top:22px;padding-bottom:60px">' +
      (S.conflict ? banner() : '') +
      '<div style="margin-top:'+(S.conflict?'16px':'0')+'">' + viewHtml() + '</div>' +
    '</div>' +
    (S.syncOpen ? syncModal() : '');

  paintStatus();
  if (fk){
    var back = document.querySelector('[data-k="'+fk.replace(/"/g,'\\"')+'"]');
    if (back){ back.focus(); try{ back.setSelectionRange(selS, selE); }catch(e){} }
  }
}
function banner(){
  return '<div class="banner" style="flex-direction:column;align-items:stretch;gap:10px">' +
    '<div><b>הגיליון בדרייב השתנה, וגם כאן יש שינויים.</b> ' +
      'צריך להחליט איזו גרסה נכונה — הדשבורד לא ידרוס כלום לבד.</div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
      '<button class="btn sm primary" data-act="force-push" title="הנתונים שעל המסך נכתבים לגיליון">' +
        'שמור את מה שכאן ← לגיליון</button>' +
      '<button class="btn sm" data-act="pull" title="הנתונים מהגיליון מחליפים את מה שעל המסך">' +
        'טען מהגיליון ← לכאן</button>' +
    '</div>' +
    '<div style="font-size:12px;opacity:.85">' +
      'עבדת רק מהדשבורד? בחר <b>שמור את מה שכאן</b>. ' +
      'ערכת ידנית בגיליון ורוצה את זה כאן? בחר <b>טען מהגיליון</b> — ' +
      'שינויים שעוד לא נשמרו מהמסך יאבדו.</div></div>';
}
function paintStatus(){
  var b = document.getElementById('netbox'); if (!b) return;
  var color = {off:'#B5AEA4', ok:'#3E5D50', saving:'#9A7B33', error:'#B4714E'}[S.net];
  var text  = !CFG.token ? 'לא מחובר' : (S.netMsg || 'מחובר');
  b.innerHTML = (S.net==='saving' ? '<span class="spin"></span>' : '<span class="dot" style="background:'+color+'"></span>') +
                '<span style="color:'+color+'">'+esc(text)+'</span>';
}
function viewHtml(){
  switch(S.view){
    case 'overview': return vOverview();
    case 'guests':   return vGuests();
    case 'seating':  return vSeating();
    case 'vendors':  return vVendors();
    case 'venues':   return vVenues();
    case 'tasks':    return vTasks();
    case 'budget':   return vBudget();
    case 'gifts':    return vGifts();
  }
  return '';
}

/* ─────────────── סקירה ─────────────── */
function vOverview(){
  var k = stats();
  var pct = k.totalPeople ? Math.round(k.confirmedPeople/k.totalPeople*100) : 0;
  var kpi = function(lbl,val,sub,color){
    return '<div class="card kpi"><div class="lbl">'+lbl+'</div><div class="val"'+(color?' style="color:'+color+'"':'')+'>'+val+'</div>'+
           (sub||'')+'</div>';
  };
  var sides = [SIDE_A,SIDE_B].map(function(name,i){
    var list = S.guests.filter(function(g){ return g.side===name; });
    var p = list.reduce(function(a,g){ return a+people(g); },0);
    var c = list.filter(function(g){ return g.rsvp==='אישר'; }).reduce(function(a,g){ return a+people(g); },0);
    var col = i===0 ? 'var(--green)' : 'var(--clay)';
    return '<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">'+
      '<span style="font-size:14px;font-weight:600">צד '+name+'</span>'+
      '<span class="muted">'+c+' אישרו מתוך '+p+'</span></div>'+
      '<div style="height:10px;background:#EFEBE4;border-radius:5px;overflow:hidden">'+
      '<div style="height:100%;background:'+col+';width:'+(k.totalPeople?Math.round(p/k.totalPeople*100):0)+'%"></div></div></div>';
  }).join('');

  var catMap = {};
  S.guests.forEach(function(g){ var c = g.category||'אחר'; catMap[c] = (catMap[c]||0)+people(g); });
  var maxCat = Math.max.apply(null,[1].concat(Object.keys(catMap).map(function(c){return catMap[c];})));
  var cats = Object.keys(catMap).sort(function(a,b){ return catMap[b]-catMap[a]; }).map(function(name){
    return '<div style="display:flex;align-items:center;gap:10px">'+
      '<span style="width:10px;height:10px;border-radius:50%;flex:none;background:'+catColor(name)+'"></span>'+
      '<span style="font-size:14px;width:96px;flex:none">'+esc(name)+'</span>'+
      '<span style="flex:1;height:8px;background:#EFEBE4;border-radius:4px;overflow:hidden"><span style="display:block;height:100%;opacity:.75;background:'+catColor(name)+';width:'+Math.round(catMap[name]/maxCat*100)+'%"></span></span>'+
      '<span class="muted" style="width:38px;text-align:left">'+catMap[name]+'</span></div>';
  }).join('');

  var up = S.tasks.filter(function(t){ return !t.done; })
    .sort(function(a,b){ return String(a.due||'9999').localeCompare(String(b.due||'9999')); }).slice(0,6)
    .map(function(t){ var d = dueMeta(t.due,t.done);
      return '<div style="display:flex;align-items:center;gap:10px;padding-bottom:9px;border-bottom:1px solid #F1ECE4">'+
        '<input type="checkbox" class="ck" data-act="task.done" data-id="'+t.id+'"'+(t.done?' checked':'')+'>'+
        '<span style="font-size:14px;flex:1">'+esc(t.title)+'</span>'+
        '<span class="pill" style="background:'+d.bg+';color:'+d.fg+'">'+d.label+'</span></div>';
    }).join('') || '<div class="muted">אין משימות פתוחות ✓</div>';

  /* ── דונאט 1: סטטוס אישורי הגעה ── */
  var notComing = S.guests.filter(function(g){ return g.rsvp==='לא מגיע'; }).reduce(function(a,g){ return a+people(g); },0);
  var waiting   = k.totalPeople - k.confirmedPeople - notComing;
  var rsvpD = donut([
    {label:'אישרו', value:k.confirmedPeople, color:'#3E5D50'},
    {label:'טרם ענו', value:waiting, color:'#D8CFBE'},
    {label:'לא מגיעים', value:notComing, color:'#B4714E'}
  ], 168, 26);

  /* ── דונאט 2: פילוח סבירות הגעה ── */
  var buckets = CHANCE_LEVELS.map(function(lv){
    return {label:lv, color:CHANCE_COLOR[lv],
      value:S.guests.filter(function(g){ return g.rsvp!=='לא מגיע' && levelOf(g)===lv; })
                    .reduce(function(a,g){ return a+people(g); },0)};
  }).concat([{label:'לא מגיעים', color:'#D8CFBE', value:notComing}]);
  var chanceD = donut(buckets, 168, 26);

  /* ── דונאט 3: מבוגרים מול ילדים ── */
  var ageD = donut([
    {label:'מבוגרים', value:k.totalPeople-k.kids, color:'#6B7A8F'},
    {label:'ילדים', value:k.kids, color:'#A08A4B'}
  ], 168, 26);

  /* ── צדדים לפי קטגוריה ── */
  var sc = {};
  S.guests.forEach(function(g){
    var c = g.category||'אחר';
    sc[c] = sc[c] || {a:0,b:0};
    sc[c][g.side===SIDE_A?'a':'b'] += people(g);
  });
  var maxPair = Math.max.apply(null,[1].concat(Object.keys(sc).map(function(c){ return sc[c].a+sc[c].b; })));
  var sideCatBars = Object.keys(sc).sort(function(x,y){ return (sc[y].a+sc[y].b)-(sc[x].a+sc[x].b); }).map(function(name){
    return '<div style="display:flex;align-items:center;gap:10px">'+
      '<span style="font-size:13.5px;width:104px;flex:none">'+esc(name)+'</span>'+
      '<span style="flex:1;height:10px;background:#F4F0EA;border-radius:5px;overflow:hidden;display:flex">'+
        '<span style="height:100%;background:#3E5D50;width:'+Math.round(sc[name].a/maxPair*100)+'%"></span>'+
        '<span style="height:100%;background:#B4714E;width:'+Math.round(sc[name].b/maxPair*100)+'%"></span></span>'+
      '<span style="font-size:12.5px;color:var(--muted);width:34px;text-align:left">'+(sc[name].a+sc[name].b)+'</span></div>';
  }).join('');

  /* ── התקדמות והיערכות ── */
  var doneTasks = S.tasks.filter(function(t){ return t.done; }).length;
  var taskPct = S.tasks.length ? Math.round(doneTasks/S.tasks.length*100) : 0;
  var overdue = S.tasks.filter(function(t){ return !t.done && t.due && new Date(t.due) < new Date(); }).length;
  var seatedNow = S.guests.filter(function(g){ return g.table; }).reduce(function(a,g){ return a+people(g); },0);
  var capacity = S.tables.reduce(function(a,t){ return a+(+t.seats||0); },0);
  var seatPct = capacity ? Math.min(100, Math.round(seatedNow/capacity*100)) : 0;
  var enough = capacity >= k.expected;

  return '<div class="grid" style="gap:22px">'+
    '<div class="grid kpis">'+
      kpi('סה״כ מוזמנים', k.totalPeople, '<div class="sub">'+S.guests.length+' רשומות · '+k.kids+' ילדים</div>')+
      kpi('אישרו הגעה', k.confirmedPeople, '<div class="bar"><i style="width:'+pct+'%"></i></div>', 'var(--green)')+
      kpi('צפי מגיעים (לפי סבירות)', k.expected,
          '<div class="sub">טווח '+Math.round(k.expected*0.9)+'–'+Math.round(k.expected*1.1)+' · '+
          (k.totalPeople?Math.round(k.expected/k.totalPeople*100):0)+'% מהרשימה</div>', '#6B7A8F')+
      kpi('הגיעו בפועל', k.arrivedPeople, '<div class="sub">מתוך '+k.confirmedPeople+' שאישרו</div>')+
      kpi('סה״כ מתנות', nis(k.gifts), '<div class="sub">ממוצע '+nis(k.arrivedPeople?k.gifts/k.arrivedPeople:0)+' לאורח</div>','var(--clay)')+
      kpi('נותר לשלם לספקים', nis(k.vendorTotal-k.vendorPaid), '<div class="sub">מתוך '+nis(k.vendorTotal)+' התחייבות</div>')+
    '</div>'+

    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">'+
      '<div class="card" style="padding:20px 22px"><div style="font-size:15px;font-weight:700;margin-bottom:14px">סטטוס אישורי הגעה</div>'+
        donutHtml(rsvpD, k.totalPeople, 'נפשות')+'</div>'+
      '<div class="card" style="padding:20px 22px"><div style="font-size:15px;font-weight:700;margin-bottom:14px">פילוח סבירות הגעה</div>'+
        donutHtml(chanceD, k.expected, 'צפי מגיעים', '#6B7A8F', false)+'</div>'+
      '<div class="card" style="padding:20px 22px"><div style="font-size:15px;font-weight:700;margin-bottom:14px">מבוגרים מול ילדים</div>'+
        donutHtml(ageD, k.kids, 'ילדים')+
        '<div class="muted" style="font-size:12px;margin-top:12px;padding-top:10px;border-top:1px solid #F1ECE4">מנות ילדים משפיעות על תמחור האולם</div></div>'+

/* ─────────────── סידור שולחנות ─────────────── */
var PAD = 26;
function sizeOf(t){
  var base = 96 + (+t.seats||8)*5;
  if (t.shape==='round')  return {w:base, h:base, radius:'50%'};
  if (t.shape==='square') return {w:base, h:base, radius:'16px'};
  if (t.shape==='rect')   return {w:base*1.5, h:base*0.72, radius:'16px'};
  return {w:base*2.1, h:96, radius:'12px'};
}
function chairsFor(t, sz, occ){
  var n = Math.max(1, +t.seats||8), out = [], cx = PAD+sz.w/2, cy = PAD+sz.h/2;
  var mk = function(x,y,w,h,r){ out.push({x:x,y:y,w:w,h:h,r:r}); };
  if (t.shape==='round'){
    var R = sz.w/2 + 13;
    for (var i=0;i<n;i++){ var a = (i/n)*Math.PI*2 - Math.PI/2; mk(cx+Math.cos(a)*R-7, cy+Math.sin(a)*R-7, 14,14,'50%'); }
  } else if (t.shape==='square'){
    var per = Math.ceil(n/4);
    for (var j=0;j<n;j++){
      var side = Math.floor(j/per), kk = j%per, f = (kk+0.5)/per;
      if (side===0) mk(PAD+sz.w*f-8, PAD-17, 16,11,'4px');
      else if (side===1) mk(PAD+sz.w+6, PAD+sz.h*f-8, 11,16,'4px');
      else if (side===2) mk(PAD+sz.w*f-8, PAD+sz.h+6, 16,11,'4px');
      else mk(PAD-17, PAD+sz.h*f-8, 11,16,'4px');
    }
  } else {
    var topN = Math.ceil(n/2), botN = n-topN;
    for (var a1=0;a1<topN;a1++) mk(PAD+sz.w*((a1+0.5)/topN)-8, PAD-17, 16,11,'4px');
    for (var a2=0;a2<botN;a2++) mk(PAD+sz.w*((a2+0.5)/botN)-8, PAD+sz.h+6, 16,11,'4px');
  }
  return out.map(function(c,i){
    return '<span class="chair" style="left:'+c.x+'px;top:'+c.y+'px;width:'+c.w+'px;height:'+c.h+'px;border-radius:'+c.r+
      ';background:'+(i<occ?'#C6D0C8':'#FFFFFF')+';border-color:'+(i<occ?'#9FB2A5':'#E4DED4')+'"></span>';
  }).join('');
}

  var bank = Object.keys(groups).sort().map(function(label){

      '</div></div>';
  }).join('');

  var sel = S.tables.filter(function(t){ return t.id===S.selectedTable; })[0];
  var editor = '';
  if (sel){
    var seated = S.guests.filter(function(g){ return g.table===sel.name; });

        '<select class="field" data-act="tb.shape" data-id="'+sel.id+'">'+
          ['round','square','rect','long'].map(function(sh){ return opt(sh, sel.shape, SHAPE_HE[sh]); }).join('')+'</select>'+
        '<input type="number" class="field" style="width:90px" data-act="tb.seats" data-id="'+sel.id+'" data-k="tbseats" value="'+sel.seats+'">'+
        '<span class="muted">'+occ+' מתוך '+sel.seats+' מקומות</span><span style="flex:1"></span>'+

        return '<div style="display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:9px;background:var(--soft);border:1px solid var(--line2);border-right:3px solid '+catColor(g.category)+'">'+

      }).join('')+'</div></div>';
  }

  var seatedPeople = S.guests.filter(function(g){ return g.table; }).reduce(function(a,g){ return a+people(g); },0);

  return '<div class="seatgrid">'+

      '<input class="field" style="width:100%;margin-bottom:12px" placeholder="חיפוש…" data-act="bankSearch" data-k="bank" value="'+esc(S.bankSearch)+'">'+

function vBudget(){
  var k = stats();

  var delta = plan - k.vendorTotal;
  var bal = k.gifts - k.vendorTotal;
  var maxV = Math.max.apply(null,[1].concat(S.vendors.map(function(x){return +x.total||0;})));
  var bars = S.vendors.slice().sort(function(a,b){ return (+b.total||0)-(+a.total||0); }).map(function(x){
    return '<div style="display:flex;align-items:center;gap:12px">'+
      '<span style="font-size:14px;width:130px;flex:none">'+esc(x.type||x.name)+'</span>'+
      '<span style="flex:1;height:12px;background:#EFEBE4;border-radius:6px;overflow:hidden"><span style="display:block;height:100%;background:var(--green);opacity:.85;width:'+Math.round((+x.total||0)/maxV*100)+'%"></span></span>'+

  'p.name': f('venues','name'), 'p.date': f('venues','date'), 'p.day': f('venues','day'),
  'p.extras': f('venues','extras'), 'p.notes': f('venues','notes'),
  'p.pricePer': f('venues','pricePer','n'), 'p.minGuests': f('venues','minGuests','n'), 'p.status': f('venues','status'),
  'p.del': function(el){ del('venues', el.dataset.id); return true; },
  'p.add': function(){ S.venues.push({id:uid(),name:'מקום חדש',date:'',day:'',pricePer:0,minGuests:0,extras:'',notes:'',status:'לבדיקה'}); touch(); return true; },

  'newTask': function(el){ S.newTask = el.value; return false; },
  'newTaskCat': function(el){ S.newTaskCat = el.value; return false; },
  'newTaskDue': function(el){ S.newTaskDue = el.value; return false; },
  'task.add': function(){
    if (!S.newTask.trim()) return false;
    S.tasks.push({id:uid(), title:S.newTask.trim(), category:S.newTaskCat, due:S.newTaskDue, done:false});
    S.newTask = ''; touch(); return true;
  },
  'task.title': f('tasks','title'),
  'task.done': function(el){ upd('tasks', el.dataset.id, {done:el.checked}); return true; },
  'task.del': function(el){ del('tasks', el.dataset.id); return true; },

  'budget': function(el){ setSetting('תקציב מתוכנן', +el.value||0); return false; },
  'importSide': function(el){ S.importSide = el.value; return false; },

  'bankSearch': function(el){ S.bankSearch = el.value; return true; },
  'newShape': function(el){ S.newShape = el.value; return false; },
  'newSeats': function(el){ S.newSeats = el.value; return false; },
  'tb.add': function(){
    var n = S.tables.length + 1, name = 'שולחן ' + n;
    while (tableByName(name)) { n++; name = 'שולחן ' + n; }
    S.tables.push({id:uid(), name:name, shape:S.newShape, seats:+S.newSeats,
                   x:40 + (S.tables.length%4)*220, y:40 + Math.floor(S.tables.length/4)*230});
    touch(); return true;
  },
  'tb.name': function(el){
    var t = row('tables', el.dataset.id); if (!t) return false;
    var old = t.name, val = el.value;
    S.guests.forEach(function(g){ if (g.table===old) g.table = val; });
    t.name = val; touch(); return false;
  },
  'tb.shape': function(el){ upd('tables', el.dataset.id, {shape:el.value}); return true; },
  'tb.seats': function(el){ upd('tables', el.dataset.id, {seats:+el.value||0}); return false; },
  'tb.del': function(el){
    var t = row('tables', el.dataset.id); if (!t) return false;
    S.guests.forEach(function(g){ if (g.table===t.name) g.table = ''; });
    S.tables = S.tables.filter(function(x){ return x.id!==t.id; });
    S.selectedTable = null; touch(); return true;
  },
  'unseat': function(el){ upd('guests', el.dataset.id, {table:''}); return true; },
  'autoseat': function(){ autoSeat(); return true; },

  'file.up': function(el){ uploadFiles(el); return false; },
  'file.del': function(el){ removeFile(el.dataset.id); return false; },

  'tpl': function(){ exportSheets('תבנית מוזמנים', [{name:'מוזמנים', rows:[{'שם מלא':'ישראל ישראלי','צד':SIDE_A,'קטגוריה':'חברים','מספר טלפון':'050-0000000','כמות':2,'ילדים (0-5)':0,'אישור הגעה':'טרם','הגיעו?':'','מתנה':0,'הערות':''}]}]); return false; },
  'export.guests': function(){ exportSheets('מוזמנים', [{name:'מוזמנים', rows:guestRows()}]); return false; },
  'export.vendors': function(){ exportSheets('ספקים', [{name:'ספקים', rows:S.vendors.map(function(x){
      return {'סוג':x.type,'שם':x.name,'איש קשר':x.contact,'מקדמה':x.advance,'סכום':x.total,'נותר':(+x.total||0)-(+x.advance||0),'מועד':x.when,'אמצעי':x.method,'סטטוס':x.status,'הערות':x.notes};
    })}]); return false; },
  'export.all': function(){
    exportSheets('ארגון חתונה - עומר ונועה', [
      {name:'מוזמנים', rows:guestRows()},
      {name:'ספקים',  rows:S.vendors.map(function(x){ return {'סוג':x.type,'שם':x.name,'איש קשר':x.contact,'מקדמה':x.advance,'סכום כולל':x.total,'נותר':(+x.total||0)-(+x.advance||0),'מועד תשלום':x.when,'אמצעי':x.method,'סטטוס':x.status,'הערות':x.notes}; })},
      {name:'מקומות', rows:S.venues.map(function(p){ return {'שם':p.name,'תאריך':p.date,'יום':p.day,'מחיר למנה':p.pricePer,'מינימום':p.minGuests,'תוספות':p.extras,'הערות':p.notes,'סטטוס':p.status}; })},
      {name:'משימות', rows:S.tasks.map(function(t){ return {'משימה':t.title,'קטגוריה':t.category,'תאריך יעד':t.due,'בוצע':t.done?'כן':''}; })},
      {name:'סידור שולחנות', rows:S.guests.filter(function(g){return g.table;}).map(function(g){ return {'שם':g.name,'שולחן':g.table,'נפשות':people(g)}; })},
      {name:'קבצים', rows:(S.files||[]).map(function(f){ return {'שם הקובץ':f.name,'שייך ל':f.ownerType,'קישור':f.url}; })}
    ]);
    return false;
  },
  'import': function(el){ importFile(el); return false; }
};
function f(coll, key, type){
  return function(el){
    var patch = {}; patch[key] = type==='n' ? (+el.value||0) : el.value;
    upd(coll, el.dataset.id, patch);
    return false;   // הציור מחדש קורה באירוע change, כדי לא לקטוע הקלדה
  };
}
// שדה טלפון: תוך כדי הקלדה נשמר כמו שהוא, וביציאה מהשדה מסודר ל-052-1234567
function fPhone(coll, key){
  return function(el, evt){
    var patch = {}; patch[key] = evt==='change' ? fixPhone(el.value) : el.value;
    upd(coll, el.dataset.id, patch);
    return false;
  };
}

/* ─────────────── שיבוץ אוטומטי ─────────────── */
function autoSeat(){
  var load = {}, catOf = {};
  S.tables.forEach(function(t){ load[t.name] = 0; });
  S.guests.forEach(function(g){
    if (g.table && load[g.table] !== undefined){
      load[g.table] += people(g);
      catOf[g.table] = catOf[g.table] || (g.side+'|'+(g.category||'אחר'));
    }
  });
  var pool = S.guests.filter(function(g){ return !g.table && g.rsvp!=='לא מגיע'; });
  var byCat = {};
  pool.forEach(function(g){ var k = g.side+'|'+(g.category||'אחר'); (byCat[k]=byCat[k]||[]).push(g); });
  Object.keys(byCat).forEach(function(k){
    byCat[k].forEach(function(g){
      var p = people(g);
      var t = S.tables.filter(function(t){ return (catOf[t.name]===k || !catOf[t.name]) && (t.seats-(load[t.name]||0))>=p; })[0];
      if (!t) t = S.tables.filter(function(t){ return (t.seats-(load[t.name]||0))>=p; })[0];
      if (t){ g.table = t.name; load[t.name] += p; catOf[t.name] = catOf[t.name] || k; }
    });
  });
  touch();
}

/* ─────────────── קבצים ─────────────── */
function uploadFiles(input){
  var file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  if (!CFG.token){ alert('כדי לשמור קבצים בדרייב צריך קודם להתחבר (כפתור "סנכרון וייבוא").'); return; }
  if (file.size > 15*1024*1024){ alert('הקובץ גדול מדי (מקסימום 15MB). העלה אותו ישירות לתיקייה בדרייב.'); return; }
  var owner = input.dataset.owner, ownerId = input.dataset.id || '';
  setNet('saving','מעלה '+file.name+'…');
  var rd = new FileReader();
  rd.onload = function(){
    var b64 = rd.result.split(',')[1];
    api('upload', {name:file.name, mime:file.type||'application/octet-stream', data:b64, ownerType:owner, ownerId:ownerId})
      .then(function(j){ S.files.push(j.file); S.rev = j.rev; persist(); setNet('ok','הקובץ נשמר בדרייב'); render(); })
      .catch(function(e){ setNet('error','העלאה נכשלה: '+e.message); alert('העלאה נכשלה: '+e.message); });
  };
  rd.readAsDataURL(file);
}
function removeFile(id){
  if (!confirm('למחוק את הקובץ מהדרייב?')) return;
  if (!CFG.token){ S.files = S.files.filter(function(f){ return f.id!==id; }); touch(); render(); return; }
  api('delfile', {id:id}).then(function(j){
    S.files = S.files.filter(function(f){ return f.id!==id; });
    S.rev = j.rev; persist(); render();
  }).catch(function(e){ alert('מחיקה נכשלה: '+e.message); });
}

/* ─────────────── אקסל ─────────────── */
function guestRows(){
  return S.guests.map(function(g){
    return {'שם מלא':g.name,'צד':g.side,'קטגוריה':g.category,'מספר טלפון':g.phone,'כמות':g.adults,
            'ילדים (0-5)':g.kids,'אישור הגעה':g.rsvp,'סבירות הגעה':levelOf(g),
            'הגיעו?':g.arrived?'V':'','מתנה':g.gift,'שולחן':g.table||'','הערות':g.notes};
  });
}
function exportSheets(base, sheets){
  if (window.XLSX){
    var wb = XLSX.utils.book_new();
    sheets.forEach(function(sh){ XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sh.rows), sh.name); });
    XLSX.writeFile(wb, base+'.xlsx');
    return;
  }
  sheets.forEach(function(sh){
    var rows = sh.rows; if (!rows.length) return;
    var head = Object.keys(rows[0]);
    var q = function(x){ return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'; };
    var csv = [head.map(q).join(',')].concat(rows.map(function(r){ return head.map(function(h){ return q(r[h]); }).join(','); })).join('\n');
    var blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = (sheets.length>1 ? base+' - '+sh.name : base)+'.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 100);
  });
}
function parseCsv(text){
  var lines = text.replace(/\r/g,'').split('\n').filter(function(l){ return l.trim(); });
  if (!lines.length) return [];
  var split = function(l){ var out=[],cur='',q=false;
    for (var i=0;i<l.length;i++){ var ch=l[i];
      if (ch==='"') q=!q; else if (ch===',' && !q){ out.push(cur); cur=''; } else cur+=ch; }
    out.push(cur); return out; };
  var head = split(lines[0]).map(function(h){ return h.trim(); });
  return lines.slice(1).map(function(l){ var c = split(l), o = {};
    head.forEach(function(h,i){ o[h] = (c[i]||'').trim(); }); return o; });
}
function sheetToGuests(rows, sideHint){
  var pick = function(r, keys){
    for (var k in r){ var kk = String(k).trim();
      for (var i=0;i<keys.length;i++){ if (kk.indexOf(keys[i])===0 || kk===keys[i]) return r[k]; } }
    return '';
  };
  var out = [];
  rows.forEach(function(r){
    var first = String(pick(r,['שם פרטי','שם'])).trim();
    var last  = String(pick(r,['שם משפחה'])).trim();
    var full  = String(pick(r,['שם מלא'])).trim() || (first+' '+last).trim();
    if (!full) return;
    var side = String(pick(r,['צד'])).trim();
    if (sideHint && sideHint!=='auto') side = sideHint;
    if (side!==SIDE_A && side!==SIDE_B) side = SIDE_A;
    var arr = String(pick(r,['הגיעו','הגיע'])).trim();
    out.push({ id:uid(), name:full, side:side,
      category:String(pick(r,['קטגוריה'])).trim()||'אחר',
      phone:fixPhone(pick(r,['מספר טלפון','טלפון'])),
      adults:+pick(r,['כמות','מבוגרים'])||1, kids:+pick(r,['ילדים'])||0,
      rsvp:String(pick(r,['אישור'])).trim()||'טרם',
      chance:(function(c){ return CHANCE_PCT[c]!==undefined ? c : ''; })(String(pick(r,['סבירות'])).trim()),
      arrived:(arr==='V'||arr==='v'||arr==='כן'),
      gift:+pick(r,['מתנה'])||0, table:String(pick(r,['שולחן'])).trim(),
      notes:String(pick(r,['הערות'])).trim() });
  });
  return out;
}
function mergeGuests(incoming){
  var key = function(g){ return String(g.name||'').replace(/\s+/g,'')+'|'+String(g.phone||'').replace(/\D/g,''); };
  var map = {}, order = [];
  S.guests.forEach(function(g){ var k = key(g); if(!(k in map)) order.push(k); map[k] = g; });
  var added = 0, updated = 0;
  incoming.forEach(function(n){
    var k = key(n);
    if (map[k]){ var ex = map[k]; Object.assign(ex, n, {id:ex.id, table:ex.table||n.table}); updated++; }
    else { map[k] = n; order.push(k); added++; }
  });
  S.guests = order.map(function(k){ return map[k]; });
  S.importMsg = 'יובאו '+added+' חדשים, עודכנו '+updated+'.';
  touch();
}
function importFile(input){
  var file = input.files && input.files[0]; input.value = '';
  if (!file) return;
  var rd = new FileReader();
  rd.onload = function(ev){
    try{
      var rows;
      if (/\.csv$/i.test(file.name) || !window.XLSX){
        if (!/\.csv$/i.test(file.name) && !window.XLSX){
          S.importMsg = 'קריאת xlsx לא זמינה (אין חיבור לרשת). שמור את הקובץ כ-CSV.'; render(); return;
        }
        rows = parseCsv(new TextDecoder('utf-8').decode(new Uint8Array(ev.target.result)));
      } else {
        var wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        rows = [];
        wb.SheetNames.forEach(function(nm){
          var r = XLSX.utils.sheet_to_json(wb.Sheets[nm], {defval:''});
          var hint = nm.indexOf(SIDE_A)>=0 ? SIDE_A : (nm.indexOf(SIDE_B)>=0 ? SIDE_B : null);
          r.forEach(function(x){ if (hint && !x['צד']) x['צד'] = hint; rows.push(x); });
        });
      }
      mergeGuests(sheetToGuests(rows, S.importSide||'auto'));
      render();
    }catch(err){ S.importMsg = 'שגיאה בקריאת הקובץ: '+err.message; render(); }
  };
  rd.readAsArrayBuffer(file);
}

/* ═══════════════════ אירועים ═══════════════════ */
function dispatch(el, evtName){
  var act = el.dataset.act;
  var fn = ACT[act];
  if (!fn) return false;
  var needsRender = fn(el, evtName);
  if (needsRender) render();
  return !!needsRender;
}
var app = document.getElementById('app');
app.addEventListener('click', function(e){
  // לחיצה מחוץ לתפריט הקטגוריות סוגרת אותו
  var closing = S.fCatOpen && !e.target.closest('.multi');
  if (closing) S.fCatOpen = false;
  var el = e.target.closest('[data-act]');
  if (!el){ if (closing) render(); return; }
  if (el.tagName==='INPUT' || el.tagName==='SELECT' || el.tagName==='TEXTAREA' || el.tagName==='A') return;
  // לחיצה בתוך החלון לא סוגרת אותו — רק לחיצה על הרקע עצמו
  if (el.classList.contains('backdrop') && e.target !== el) return;
  e.preventDefault();
  if (!dispatch(el, 'click') && closing) render();
});
// הקלדה: מעדכנים מצב בלי לצייר מחדש (חוץ מחיפוש/סינון) כדי לא לקטוע הקלדה.
app.addEventListener('input', function(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  if (el.type==='checkbox' || el.type==='file' || el.tagName==='SELECT' || el.type==='date') return;
  dispatch(el, 'input');
});
// סיום עריכה / בחירה / סימון: מעדכנים ומציירים מחדש (כל המדדים מתעדכנים).
app.addEventListener('change', function(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  var fn = ACT[el.dataset.act]; if (!fn) return;
  fn(el, 'change');
  if (el.type !== 'file') render();
});
app.addEventListener('keydown', function(e){
  if (e.key==='Escape' && S.fCatOpen){ S.fCatOpen = false; render(); return; }
  if (e.key!=='Enter') return;
  if (e.target.id==='gatepw'){ e.preventDefault(); tryLogin(); return; }
  if (e.target.dataset && e.target.dataset.act==='newTask'){ e.preventDefault(); dispatch(e.target,'input'); ACT['task.add'](); render(); }
});

/* גרירה: שם מהבנק → שולחן, והזזת שולחנות בקנבס */
var dragGuest = null;
app.addEventListener('dragstart', function(e){
  var chip = e.target.closest('[data-drag]');
  if (!chip) return;
  dragGuest = chip.dataset.drag;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', dragGuest); }catch(err){}
});
app.addEventListener('dragover', function(e){
  if (e.target.closest('#canvas')) e.preventDefault();
});
app.addEventListener('drop', function(e){
  var node = e.target.closest('.tnode'); if (!node) return;
  e.preventDefault();
  var t = row('tables', node.dataset.table);
  if (t && dragGuest){ upd('guests', dragGuest, {table:t.name}); dragGuest = null; render(); }
});
app.addEventListener('pointerdown', function(e){
  var node = e.target.closest('.tnode'); if (!node || e.button!==0) return;
  var t = row('tables', node.dataset.table); if (!t) return;
  var startX = e.clientX, startY = e.clientY, ox = t.x, oy = t.y, moved = false;
  var move = function(ev){
    var dx = ev.clientX-startX, dy = ev.clientY-startY;
    if (!moved && Math.abs(dx)+Math.abs(dy) < 4) return;
    moved = true;
    var snap = function(n){ return Math.max(PAD, Math.round(n/13)*13); };
    t.x = snap(ox+dx); t.y = snap(oy+dy);
    node.style.left = (t.x-PAD)+'px'; node.style.top = (t.y-PAD)+'px';
  };
  var up = function(){
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    if (moved){ touch(); }
    else { S.selectedTable = t.id; render(); }
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
});

/* ═══════════════════ הפעלה ═══════════════════ */
// מכשיר מוכר → מציירים מיד מהמטמון המקומי ומרעננים ברקע.
// מכשיר חדש → מסך כניסה, והנתונים מגיעים מהגיליון אחרי שהסיסמה אושרה.
render();
if (authed) pull().catch(function(){ /* אין רשת — עובדים מהעותק המקומי */ });
</script>
